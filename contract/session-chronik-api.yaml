openapi: 3.1.0
info:
  title: Taleward API
  version: 0.4.11
  description: |
    Schnittstelle zwischen der Taleward-App (Android, Web) und dem Taleward-Server.

    Grundregeln:
    - Alle Endpunkte außer /auth/login, /auth/register, /info und /invites/{code} erfordern ein Bearer-Token.
    - Rollen gelten pro Kampagne: `gm` (Spielleitung) oder `player`.
    - Der SERVER setzt den Spoilerschutz durch: Einträge mit `visibility: gm_only`,
      offene Vorschläge, SL-Notizen und Transkripte werden an Spieler nie ausgeliefert
      (auch nicht in Listen oder als Anzahl).
    - Ein Upload wird nur angenommen, wenn alle Anwesenden der Session eingewilligt haben.
    - Audio bleibt je nach Einstellung des Servers (`/info` → `audioRetention`) bis zur Freigabe des Recaps, höchstens
      `maxDays` Tage, oder wird gleich nach der Transkription gelöscht (siehe `audioDeletedAt`).
    - Stimmprofile sind freiwillig. Speaker.source `voice_match` heißt: über ein Stimmprofil erkannt.
    - Zeitangaben in ISO 8601 (UTC), IDs als UUID-Strings.
    - Die App kann mit mehreren Servern gleichzeitig arbeiten. Jeder Server hat eigene Konten; Tokens sind an
      ihren Server gebunden (JWT-`aud` = Server-ID) und werden von anderen Servern abgelehnt.
      Datenmodell-Empfehlung: Konto getrennt von Anmeldearten (Passwort; später OpenID Connect eines zentralen
      Anmeldedienstes; später Passkeys) – `GET /info` meldet sie in `authMethods`.
    - Oberste Ebene ist die Organisation (Verein, Laden, Gruppe). Ein selbst betriebener Server hat meist genau eine.
    - Der Server protokolliert pro Session und Unterlage Audiodauer, Rechenzeit, Tokens des Sprachmodells und
      geschätzte Kosten. Abgerechnet würde beim Betreiber der Kampagne (SL) oder – falls übernommen – bei der
      Organisation. Spieler verursachen nie Kosten.
    - App-Versionen (ab 0.3.9): Die App schickt an Server ab 0.3.9 bei jeder Anfrage `X-Taleward-App: <Version>`
      (CORS: Header erlauben!). Ist minAppVersion gesetzt und die App älter – oder fehlt der Header ganz –, antwortet
      der Server auf alles außer /info, /einladung und /verwaltung mit 426 `app_outdated` (message nennt die
      Mindestversion). Die App sperrt dann die Kampagnen dieses Servers und zeigt den Download (appDownloadUrl).
    - App-Updates (ab 0.4.1): Der Server holt täglich das neueste Release aus `Tinkerworkss/taleward-app` (Tag `v1.2.3`
      oder `app-v1.2.3`, Anhang `*.apk`), prüft die SHA-256 und bietet die Datei selbst an
      (`https://<server>/downloads/app/<version>/<datei>.apk`, öffentlich). /info nennt latestAppVersion, appDownloadUrl
      (immer dieser Server), appDownloadSha256, appDownloadSizeBytes, releaseNotes; von Hand eingetragene Werte haben
      Vorrang. Freigabe automatisch oder von Hand – sie regelt nur, was dieser Server verteilt, und verbietet keine
      neueren Apps (einzige Sperre: minAppVersion → 426).
      App: Die höchste latestAppVersion aller Server gewinnt, geladen vom anbietenden Server. APK-Fassung: herunterladen,
      SHA-256 prüfen, Installationsdialog (REQUEST_INSTALL_PACKAGES, FileProvider); Play-Store-Fassung ohne Updater
      („Update im Play Store“). Beide mit demselben Schlüssel signiert. Kompatibilitätsfenster: Die App unterstützt
      apiVersion ab einer festen Untergrenze (mindestens 12 Monate zurück); ältere Server gelten als „veraltet“.
    - Web-Fassung (ab 0.4.2): Die App läuft auch im Browser – zentral unter eigener Adresse `https://app.taleward.org/`
      (an der Wurzel; bis Oktober 2026 `https://taleward.org/app/`, das künftig dorthin umleitet) und optional auf
      jedem Server (`https://<server>/app/`). Dieselbe Web-Fassung läuft an beiden Pfaden. Sie spricht direkt mit
      den Vereinsservern, die Website sieht keine Inhalte. Server müssen dafür CORS erlauben: Herkunft der zentralen
      Web-App (Voreinstellung, in der Verwaltung abschaltbar) und die eigene; erlaubte Header mindestens Authorization,
      Content-Type, Accept-Language, X-Taleward-App, X-Chunk-SHA256; Methoden GET, POST, PUT, PATCH, DELETE.
      Voraussetzung: HTTPS (Browser blockieren http-Server von einer https-Seite aus).
    - Anmelden mit einem Dienst (ab 0.4.0) – die App spricht nie selbst mit Google & Co.:
      1. App erzeugt verifier (43–128 Zeichen, zufällig) und challenge = BASE64URL(SHA-256(verifier)).
      2. App öffnet im Systembrowser (Android Custom Tabs) GET /auth/oidc/{provider}/start?challenge=…&purpose=login|link
         (bei link zusätzlich &linkToken=… aus POST /me/providers/{provider}/link).
      3. Server leitet zum Dienst, bekommt die Antwort auf https://<server>/auth/oidc/{provider}/callback und leitet auf
         `taleward://auth?ticket=…&serverId=…` weiter (Ticket 2 min, einmalig) bzw. `taleward://auth?error=<code>`.
      4. App: POST /auth/oidc/exchange {ticket, verifier} → status ok | register | email_in_use.
      Der Server speichert vom Dienst nur die Kennung (sub) und die bestätigte E-Mail, nie dessen Tokens. Jeder Server
      meldet sich selbst bei den Diensten an (keine zentrale Stelle). Voraussetzung: HTTPS mit eigener Domain.
    - E-Mail ist freiwillig und nur für Kontozwecke (Passwort vergessen, Bestätigung). Sie erscheint nur für die Person
      selbst (/me, Login, Registrierung, Export), nie für andere.
    - Die App schickt `Accept-Language: de` oder `en`. Der Server liefert `message` in dieser Sprache
      (Standard und Rückfall: de). Inhalte (Recaps, Bibel) folgen dagegen `Campaign.language`.
    - Einwilligung: Jede anwesende Person muss selbst zugestimmt haben – entweder dauerhaft in der eigenen App
      (`consentSource: app`, gilt bis zum Widerruf) oder vor Ort selbst auf dem Gerät der SL (`on_site`, nur diese
      Session; auch für Gäste ohne Konto). Es gibt keine Zustimmung durch die SL stellvertretend.
    - Fehler kommen immer als `{code, message}`; `message` ist in der Sprache aus `Accept-Language` (de | en,
      Standard de) und kann direkt angezeigt werden.
      Die App sollte auch nicht aufgeführte Fehler generisch mit `message` anzeigen.
    - Was ein Nutzer nicht sehen darf, liefert 404 statt 403, damit schon die Existenz nicht verraten wird.
      403 gibt es nur, wenn die Existenz ohnehin bekannt ist (z. B. SL-Endpunkt einer veröffentlichten Session).

    Änderungen gegenüber 0.2.0: Fehlercodes 400/401/404/409/413 ergänzt, neuer Endpunkt
    `POST /sessions/{sessionId}/retry`, `GET /campaigns/{campaignId}` liefert 404 statt 403 für
    Nicht-Mitglieder, optionaler Header `X-Chunk-SHA256` beim Hochladen eines Teils.
    Änderungen in 0.3.1: Bei source=table dürfen mehrere Dateien kommen –
    aufeinanderfolgende Abschnitte einer Aufnahme, die der Server in Array-Reihenfolge zusammenfügt.
    Änderungen in 0.3.2: `PATCH /campaigns/{campaignId}` (nur SL) für Titel, Kurzbeschreibung und
    Welt-Hintergrund; neues Feld `worldInfo` in Campaign. Terminabstimmung (`/campaigns/{id}/date-poll`,
    `/date-polls/...`) mit `nextSessionAt` und `datePollNeedsMyVote` in CampaignSummary.
    Kommentare pro Kapitel (`/sessions/{id}/comments`, `/comments/{id}`), öffentlich oder privat.
    Einwilligung: stehende Zustimmung pro Mitglied und Kampagne (`PUT /campaigns/{id}/recording-consent`,
    `Member.recordingConsentAt`), Anwesende mit `consentSource` (app | on_site) und Gäste (`guestName`).
    Sprache: Header `Accept-Language` (de | en) für `message`; `Campaign.language` für Transkription und Recaps.
    Titelbild: `coverPreset` (mitgeliefertes Motiv) oder eigenes Bild (`/campaigns/{id}/cover-image`).
    Ungelesen: `CampaignSummary.unread`, `SessionSummary.unreadComments`, Marker per `POST /campaigns/{id}/seen`
    und `POST /sessions/{id}/seen`. Charakterbilder: `/campaigns/{id}/members/{memberId}/portrait`.
    Charakter: `Member.characterSummary` (für alle) und `Member.characterBackstory` (nur Person selbst und SL).
    Geteilte Bibeleinträge: `Entry.gmNotes` / `Proposal.gmNotes` (geheimer Teil, für Spieler weggelassen).
    SL-Unterlagen: `/campaigns/{id}/documents`, `/documents/{id}` … – Auswertung zu Bibel-Vorschlägen.
    Mehrere Server: öffentliches `GET /info`, `POST /auth/register` mit Einladungscode, Einladungslinks
    `https://<server>/einladung/<CODE>`. Konto: `GET /me/export`, `DELETE /me`. Organisationen: `GET /organizations`,
    `CampaignSummary.organization`. Verbrauch: `GET /campaigns/{id}/usage`.
    Änderungen in 0.3.3: `Campaign.system` (GameSystem) und `Campaign.systemName`, setzbar per POST/PATCH
    /campaigns; 409 bei POST /campaigns/{id}/sessions ergänzt; Grundregeln zu öffentlichen Endpunkten und zur
    Sprache von `message` korrigiert.
    Änderungen in 0.3.4: 400 bei GET /campaigns/{id}/usage (month muss YYYY-MM sein); externe Transkription:
    `ServerInfo.externalTranscription`, `Campaign.allowExternalTranscription` (nur SL, per PATCH),
    `Session.transcriptionEngine`.
    Änderungen in 0.3.5: `Proposal.action` kennt zusätzlich `reveal` – ein geheimer Bibeleintrag ist am Tisch bekannt
    geworden; die SL gibt ihn per Vorschlag frei. PATCH /entries/{id} mit visibility public verlangt einen
    öffentlichen Text (400 sonst).
    Änderungen in 0.3.6: `Entry.hiddenFromMemberIds` – öffentliche Einträge vor einzelnen Mitgliedern verbergen
    („Wer weiß was“); Charakterbild mit gewähltem Ausschnitt (`cropX`, `cropY`, `cropSize` bei PUT …/portrait).
    Änderungen in 0.3.7: `Proposal.hiddenFromMemberIds` – schon beim Prüfen festlegen, vor wem ein öffentlicher
    Vorschlag verborgen ist (PATCH /proposals/{id}); wird beim Veröffentlichen/Übernehmen in den Eintrag übernommen.
    Änderungen in 0.3.8: 410 bei GET …/speakers/{speakerId}/sample mit Error-Schema
    (`audio_deleted`); Beispielwert von ServerInfo.apiVersion aktualisiert.
    Änderungen in 0.3.9: App-Versionen – ServerInfo.minAppVersion, latestAppVersion, appDownloadUrl, releaseNotes;
    Header `X-Taleward-App` (App-Version, nur an Server ab 0.3.9); 426 `app_outdated` für zu alte Apps.
    Änderungen in 0.3.10: `Campaign.allowCloudSummary` (SL erlaubt Recap/Vorschläge über eine Cloud-API je Kampagne);
    ServerInfo.externalTranscriptionMode (fallback|primary) und ServerInfo.cloudSummary; `Member.deletedAt` für
    gelöschte Konten; 429 bei POST /auth/register; VoteAnswer-Werte in Anführungszeichen.
    Änderungen in 0.4.0 (Anmeldung): freiwillige E-Mail nur fürs Konto (PUT/DELETE /me/email), „Passwort vergessen“
    (POST /auth/password-reset), Passwort setzen/ändern (PUT /me/password), Anmelden mit Google, Discord, Apple,
    Microsoft über den Systembrowser und den Server (/auth/oidc/…, PKCE-Ticket, Rückweg taleward://auth), Dienste
    verbinden/trennen, zweite Form von POST /auth/register mit registrationToken, DELETE /me mit confirmUsername.
    ServerInfo.authProviders, ServerInfo.passwordReset; User.email, emailPending, hasPassword, providers.
    Änderungen in 0.4.1: ServerInfo.appDownloadSha256 und appDownloadSizeBytes; Regeln für App-Updates über den eigenen
    Server (siehe Grundregeln).
    Änderungen in 0.4.2: Web-Fassung der App unter /app/ (zentral auf der Taleward-Website und auf eigenen Servern):
    CORS-Regeln, Parameter `returnTo` bei /auth/oidc/{provider}/start für den Rückweg in den Browser.
    Änderungen in 0.4.3: CoverPreset um 19 Titelbilder erweitert (dark-fantasy bis riverside-mystery), bestehende
    IDs unverändert.
    Änderungen in 0.4.4: ServerInfo.audioRetention – wie lange das Session-Audio bleibt; die App nennt es im
    Einwilligungstext (dauerhaft und vor Ort), dazu den Cloud-Dienst, falls die Kampagne ihn erlaubt. Wird die
    Aufbewahrung in der Verwaltung verlängert, setzt der Server recordingConsentAt aller Mitglieder zurück; die App
    fragt dann mit dem neuen Wortlaut erneut.
    Änderungen in 0.4.5: Kampagnen abschließen (PATCH archived, CampaignSummary.archivedAt) und löschen
    (DELETE /campaigns/{id}), Mitglied entfernen bzw. selbst verlassen (DELETE …/members/{memberId}, Member.leftAt),
    Regeln für Rollenwechsel (last_gm), unveröffentlichtes Kapitel verwerfen (DELETE /sessions/{id}).
    Änderungen in 0.4.6 (Qualitätsprüfung): Proposal.flags `evidence_not_found`; Recap.review (Absätze mit Belegen und
    Prüfbericht, nur SL); GET /sessions/{id}/uncertain-terms und POST /sessions/{id}/corrections (unsichere Namen
    korrigieren, optional erneut transkribieren); Campaign.hotwords (Namenshilfe, nur SL); feste Schlüssel für
    ProcessingStatus.message während summarizing. Kein neuer ProcessingState. Alles Neue ist nur für die SL und wird
    Spielern gar nicht ausgeliefert (nicht null, sondern weggelassen); ältere Apps ignorieren die Felder.
    Änderungen in 0.4.7 (Charaktere): Die App ist Ort der Wahrheit für Charaktere (eigene Sammlung, auf mehreren
    Servern nutzbar); der Server hält eine Kopie mit characterId/characterVersion und bearbeitet sie nie. Beitritt mit
    Charakter (POST /campaigns/join, character), PUT/DELETE …/members/me/character, mitgebrachte Welt als Vorschläge
    für die SL (POST/GET …/members/me/world, GET /campaigns/{id}/character-proposals), Chronik als Abschrift
    (GET …/members/me/chronicle), Eintragsart pc, Proposal.source, DocumentKind character_sheet, Hinweise an die SL
    (Campaign.gmNotices, z. B. Neuzugang bei teilweise verborgenen Einträgen), Stimmen von Gästen benennen
    (guestName bei PUT …/speakers, Speaker.assignedGuestName), Error.details. Kein Kampagnen-Umzug (kommt in 0.4.8).
    Änderungen in 0.4.8 (Kampagnen-Umzug): Die SL nimmt eine Kampagne als Datei `taleward-kampagne/1` (ZIP) mit und
    legt sie auf einem anderen Server wieder an; Server sprechen nie miteinander. Zustimmung zum Mitnehmen der eigenen
    Charakterdaten (Member.moveConsentAt, PUT …/members/me/move-consent); Export als Auftrag (POST/GET
    /campaigns/{id}/exports, Datei über downloadUrl); Import stückweise wie Aufnahmen (POST /imports, Teile,
    complete); offene Plätze (Member.openSeat) einnehmen per Beitritt mit passendem Charakter, Platz-Einladung
    (POST …/members/{id}/invite), „Das bin ich“ für die SL (…/take), Platz freigeben (…/release); Hinweis an die SL
    `seat_claimed`. characterId/characterVersion sehen nur noch die Person selbst und die SL. Transkripte,
    Hörproben, Stimmprofile, Einwilligungen, Vorschläge und der Prüfteil des Recaps verlassen den Server nie.
    Änderungen in 0.4.9 (Figuren ausgetretener Spieler, Begrenzung von Fehlversuchen): Die Figur einer Person, die
    die Kampagne verlassen hat (oder deren Konto gelöscht ist), bleibt als Geschichte in der Kampagne. Die SL macht
    daraus einen NSC (POST /entries/{id}/to-npc) oder gibt sie einem anderen Spieler (POST /entries/{id}/assign);
    Hinweis an die SL beim Austritt: gmNotices `character_orphaned`; Entry.formerHolderMemberId (nur SL). Die Person
    selbst (Hintergrund, Kommentare, Zustimmungen, characterId, Porträt) geht nicht mit. 429 `too_many_requests` auch
    bei POST /auth/login und POST /campaigns/join. Einladungscodes ab Server 0.4.37 länger (WORT-12345678).
    Änderungen in 0.4.10 (Kapitel neu schreiben, Stimmen nachträglich prüfen, Vorschau einer Einladung): Die SL lässt
    ein Kapitel im Zustand awaiting_review aus der vorhandenen Abschrift neu schreiben (POST
    /sessions/{id}/resummarize). Speaker.assignedMemberId zeigt die bestätigte Zuordnung; GET …/speakers geht auch nach
    der Bestätigung, PUT …/speakers in awaiting_review ändert die Zuordnung und schreibt das Kapitel neu. GET
    /invites/{code} nennt vor dem Beitritt ohne Anmeldung den Kampagnentitel (begrenzt wie der Beitritt).
    Änderungen in 0.4.11 (Wer schreibt die Kapitel): ServerInfo.cloudSummaryInfo und
    ServerInfo.externalTranscriptionInfo (CloudProviderInfo: Name, EU oder nicht, Land). Die App zeigt allen Mitgliedern
    einer Kampagne mit allowCloudSummary bzw. allowExternalTranscription, wer die Kapitel schreibt bzw. transkribiert,
    und nennt es im Einwilligungstext. Fehlen die Felder (ältere Server), zeigt die App nur die Kennung.

servers:
  - url: https://taleward.example.org/api/v1
    description: Server eines Vereins oder einer Gruppe (Beispiel)
  - url: http://localhost:8000/api/v1
    description: Lokaler Server zum Entwickeln

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Stimmprofil
  - name: Kampagnen
  - name: Sessions
  - name: Upload
  - name: Stimmen
  - name: Vorschläge
  - name: Chronik
  - name: Bibel
  - name: Termine
  - name: Kommentare
  - name: Unterlagen
  - name: Charaktere
  - name: Umzug

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Anmelden
      description: |
        Ab 0.4.9: Fehlversuche sind begrenzt (10 je Benutzername und 30 je Adresse in 15 Minuten) → 429
        `too_many_requests` mit lesbarer message. Server 0.4.37 vor YAML 0.4.9 antwortet dafür noch mit 401 und
        code `too_many_requests`; die App richtet sich nach dem code, nicht nach dem Status.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Angemeldet
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /info:
    get:
      tags: [Auth]
      summary: Öffentliche Angaben des Servers (ohne Anmeldung)
      description: Die App prüft damit eine Adresse, zeigt Betreiber und Datenschutzhinweis und warnt bei alter Version.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /auth/register:
    post:
      tags: [Auth]
      summary: Konto mit Einladungscode anlegen
      description: |
        Nur mit gültigem Einladungscode (registration invite_only; 404 `invite_invalid`), sonst 403 `registration_closed`.
        Legt nur das Konto an – den Beitritt zur Kampagne macht die App danach mit POST /campaigns/join.
        acceptPrivacy und ageConfirmed müssen true sein (400 `consent_required`); beides mit Zeitpunkt protokollieren.
        Passwort mindestens 8 Zeichen (400 `weak_password`), Benutzername eindeutig (409 `username_taken`).
        Gegen Durchprobieren von Codes: Anfragen pro Adresse begrenzen (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Mit Benutzername und Passwort
                  required: [inviteCode, username, displayName, password, acceptPrivacy, ageConfirmed]
                  properties:
                    inviteCode: { type: string }
                    username: { type: string, description: "3–64 Zeichen aus Buchstaben, Ziffern, . - _ (400 username_invalid); wird kleingeschrieben" }
                    displayName: { type: string }
                    password: { type: string, format: password, minLength: 8 }
                    acceptPrivacy: { type: boolean, enum: [true] }
                    ageConfirmed: { type: boolean, enum: [true], description: "Mindestalter aus /info erreicht oder Eltern einverstanden" }
                - type: object
                  title: Nach Anmeldung mit einem Dienst (ab 0.4.0)
                  description: |
                    registrationToken aus POST /auth/oidc/exchange (status register, 15 min gültig). Benutzername bildet der
                    Server (eindeutig, später änderbar), kein Passwort. Die bestätigte E-Mail des Dienstes wird übernommen.
                    Einladungspflicht wie oben. 400 registration_token_invalid.
                  required: [inviteCode, registrationToken, displayName, acceptPrivacy, ageConfirmed]
                  properties:
                    inviteCode: { type: string }
                    registrationToken: { type: string }
                    displayName: { type: string }
                    acceptPrivacy: { type: boolean, enum: [true] }
                    ageConfirmed: { type: boolean, enum: [true] }
      responses:
        "201":
          description: Angelegt und angemeldet
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Zu viele Versuche (`too_many_requests`, mehr als 10 je Adresse in 15 Minuten)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Passwort vergessen – Link an die bestätigte E-Mail (ab 0.4.0, ohne Anmeldung)
      description: |
        Antwortet immer 202, gleich ob es das Konto gibt (niemand soll so herausfinden, wer ein Konto hat). Nur wenn eine
        bestätigte E-Mail existiert, geht dorthin ein Link auf https://<server>/passwort/<token> (einmalig, 1 h). Danach
        ist das Konto überall abgemeldet. Begrenzung je Adresse und je Konto (429). Nur wenn ServerInfo.passwordReset.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, description: "Benutzername oder E-Mail" }
      responses:
        "202": { description: Angenommen (immer) }
        "429":
          description: Zu viele Versuche
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /auth/oidc/{provider}/start:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [google, discord, apple, microsoft] } }
    get:
      tags: [Auth]
      summary: Anmelden mit einem Dienst starten – nur im Systembrowser öffnen (ab 0.4.0)
      description: |
        Kein JSON-Endpunkt: Der Server leitet (302) zum Dienst weiter – auch bei Fehlern (dann gleich auf den Rückweg).
        Die Rückleitung vom Dienst kommt als 303 auf taleward://auth?ticket=…&serverId=… oder taleward://auth?error=<code>;
        die Seite enthält zusätzlich einen Link „Zurück zu Taleward“. Fehlercodes: provider_unknown (Dienst unbekannt oder
        nicht eingerichtet), oidc_failed, cancelled, link_invalid (linkToken abgelaufen oder schon benutzt).
        Von der Mindestversion (426) ausgenommen, weil der Systembrowser keinen App-Header schickt; exchange nicht.
      security: []
      parameters:
        - { name: challenge, in: query, required: true, schema: { type: string }, description: "BASE64URL(SHA-256(verifier)), ohne Füllzeichen" }
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [login, link] } }
        - { name: linkToken, in: query, schema: { type: string }, description: "Nur bei purpose=link" }
        - name: returnTo
          in: query
          schema: { type: string }
          description: |
            Nur Web-Fassung (ab 0.4.2): Rückweg statt taleward://auth, z. B. `https://app.taleward.org/#/auth`. Der Server
            hängt `?ticket=…&serverId=…` bzw. `?error=…` wörtlich an den Wert an (auch hinter `#/auth`). Erlaubt sind nur
            fest hinterlegte Ziele: `<PUBLIC_URL>/app/#/auth` und die zentrale Web-App (`<Herkunft>/#/auth`); sonst Rückweg mit
            error=return_to_not_allowed über taleward://auth.
      responses:
        "302": { description: Weiterleitung zum Dienst }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/oidc/exchange:
    post:
      tags: [Auth]
      summary: Ticket aus taleward://auth gegen Anmeldung tauschen (ab 0.4.0)
      description: |
        Nur die App, die mit challenge gestartet hat, kennt den verifier. Ergebnis je status:
        ok – angemeldet (bei link: Dienst jetzt verbunden, accessToken dann null);
        register – noch kein Konto: App zeigt „Konto anlegen“ ohne Benutzername/Passwort, dann POST /auth/register mit
        registrationToken (15 min); user fehlt dann in der Antwort (ebenso bei email_in_use);
        email_in_use – die vom Dienst bestätigte E-Mail gehört schon zu einem Konto; der Server verbindet nicht selbst
        (Schutz vor Kontoübernahme). App: „Melde dich mit deinem Benutzernamen an und verbinde {Dienst} dann unter Konten
        und Server.“
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, verifier]
              properties:
                ticket: { type: string }
                verifier: { type: string }
      responses:
        "200":
          description: Ergebnis
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok, register, email_in_use] }
                  accessToken: { type: [string, "null"] }
                  expiresAt: { type: [string, "null"], format: date-time }
                  user: { $ref: "#/components/schemas/User" }
                  registrationToken: { type: [string, "null"] }
                  suggestedDisplayName: { type: [string, "null"] }
                  email: { type: [string, "null"] }
                  provider: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/email:
    put:
      tags: [Auth]
      summary: E-Mail eintragen oder ändern – freiwillig, nur für Kontozwecke (ab 0.4.0)
      description: |
        202; der Server schickt einen Bestätigungslink (24 h) auf https://<server>/konto/email/<token>. Bis dahin steht die
        Adresse in User.emailPending. Fehler: 400 invalid_email, 409 email_taken (an anderem Konto bestätigt),
        503 mail_unavailable, 429 (höchstens 5 pro Stunde).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202": { description: Bestätigungslink verschickt }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Zu viele Versuche
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: Der Server kann keine E-Mails verschicken (`mail_unavailable`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    delete:
      tags: [Auth]
      summary: Bestätigte und offene E-Mail entfernen (ab 0.4.0)
      responses:
        "204": { description: Entfernt }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/password:
    put:
      tags: [Auth]
      summary: Passwort setzen (Konten ohne Passwort) oder ändern (ab 0.4.0)
      description: |
        Mit Passwort: currentPassword nötig (401 wrong_password). Ohne Passwort (hasPassword false): currentPassword
        entfällt. 400 weak_password. 204; danach sind alle anderen Geräte abgemeldet – das eigene Token bleibt gültig.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        "204": { description: Gespeichert }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/providers/{provider}/link:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [google, discord, apple, microsoft] } }
    post:
      tags: [Auth]
      summary: Dienst mit dem eigenen Konto verbinden – linkToken für /auth/oidc/…/start holen (ab 0.4.0)
      description: linkToken gilt 5 min. Danach wie beim Anmelden, nur mit purpose=link; exchange liefert status ok.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  linkToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/providers/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string, enum: [google, discord, apple, microsoft] } }
    delete:
      tags: [Auth]
      summary: Dienst trennen (ab 0.4.0)
      description: 409 last_login_method, wenn das Konto danach weder Passwort noch einen anderen Dienst hätte.
      responses:
        "204": { description: Getrennt }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/export:
    get:
      tags: [Auth]
      summary: Alle eigenen Daten auf diesem Server als JSON (Recht auf Datenübertragbarkeit)
      description: |
        Konto (ab 0.4.0 mit email und den Namen verbundener Dienste, keine Kennungen), Mitgliedschaften mit
        Charakterangaben, eigene Kommentare, Zustimmungen mit Zeitpunkten, Stimmprofil-Status (ohne Stimmabdruck),
        Charakterbilder als Verweise. Ab 0.4.7 zusätzlich characters[]: { characterId, campaigns: [{ serverCampaignId,
        title, memberId, joinedAt, leftAt }] }.
      responses:
        "200":
          description: JSON-Datei
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    delete:
      tags: [Auth]
      summary: Eigenes Konto auf diesem Server löschen
      description: |
        Passwort zur Bestätigung (401 bei falschem). Leitet die Person Kampagnen als einzige SL, 409 `last_gm_campaigns`
        mit den Titeln in message. Gelöscht werden Konto, Anmeldungen, Charakterbilder, Charakter-Hintergrund,
        Zustimmungen (Protokoll des Widerrufs bleibt als Nachweis), Stimmprofil. Kommentare bleiben mit Autor
        „gelöschtes Konto“ stehen; Transkripte/Recaps bleiben unverändert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Konten mit Passwort bestätigen mit password (401 wrong_password), Konten ohne Passwort mit confirmUsername (400 confirmation_mismatch).
              properties:
                password: { type: string, format: password }
                confirmUsername: { type: string }
      responses:
        "204": { description: Gelöscht }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Auth]
      summary: Eigenes Profil
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/voice-profile:
    get:
      tags: [Stimmprofil]
      summary: Status des eigenen Stimmprofils
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Stimmprofil]
      summary: Stimmprofil anlegen oder neu aufnehmen (freiwillig, eigene Einwilligung)
      description: |
        Etwa 20–30 Sekunden vorgelesener Text. Der Server berechnet daraus einen Stimmabdruck
        (biometrisches Datum nach DSGVO) und löscht das Audio danach. Ein vorhandenes Profil wird ersetzt.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, consent]
              properties:
                audio: { type: string, format: binary }
                consent:
                  type: string
                  enum: ["true"]
                  description: Ausdrückliche Einwilligung in die Speicherung des Stimmabdrucks
                learnFromSessions: { type: string, enum: ["true", "false"] }
      responses:
        "202":
          description: Wird verarbeitet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceProfile" }
        "400":
          description: Aufnahme zu kurz oder Einwilligung fehlt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    patch:
      tags: [Stimmprofil]
      summary: Einstellungen ändern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                learnFromSessions: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Stimmprofil]
      summary: Stimmprofil und alles daraus Gelernte endgültig löschen
      responses:
        "204": { description: Gelöscht }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /campaigns:
    get:
      tags: [Kampagnen]
      summary: Eigene Kampagnen (als SL oder Spieler)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Kampagnen]
      summary: Neue Kampagne anlegen (Ersteller wird SL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                language: { $ref: "#/components/schemas/ContentLanguage" }
                organizationId: { type: string, description: "Nur nötig, wenn man mehreren Organisationen angehört" }
                system:
                  oneOf:
                    - { $ref: "#/components/schemas/GameSystem" }
                    - { type: "null" }
                systemName: { type: [string, "null"], maxLength: 100 }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /campaigns/join:
    post:
      tags: [Kampagnen]
      summary: Mit Einladungscode beitreten (Rolle player)
      description: |
        Ab 0.4.9: falsche Codes sind begrenzt (10 je Konto und 30 je Adresse in 15 Minuten) → 429 `too_many_requests`.
        Server 0.4.37 vor YAML 0.4.9 antwortet dafür noch mit 409 und code `too_many_requests`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: "RABE-48213759"
                  description: "Wort, Bindestrich, Ziffern. Ab Server 0.4.37 acht Ziffern, ältere Codes (vier Ziffern) gelten bis zum Ablauf."
                characterName: { type: string, description: "Freier Name ohne Sammlung (Gäste, ältere Apps)" }
                character:
                  description: |
                    Ab 0.4.7: Charakter aus der Sammlung der App. Setzt Member.character* und legt den pc-Eintrag an
                    (öffentlich, holderMemberId = das neue Mitglied). Mit characterName zusammen gewinnt character.name.
                    Gleiche characterId schon bei einem aktiven Mitglied dieser Kampagne → 409 character_in_campaign.
                    Ab 0.4.8: Passt die characterId zu einem offenen Platz (openSeat), setzt sich die Person auf diesen
                    Platz (immer als player; übernimmt Anwesenheit, Erwähnungen, Kommentare, Verborgen-Listen), die SL
                    bekommt gmNotices seat_claimed. Ein Platz-Code (POST …/members/{id}/invite) setzt die Person immer
                    auf genau diesen Platz, mit oder ohne Charakter.
                  oneOf:
                    - { $ref: "#/components/schemas/Character" }
                    - { type: "null" }
      responses:
        "200":
          description: Beigetreten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /invites/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string }
        description: Einladungscode, Groß- und Kleinschreibung egal (wie bei POST /campaigns/join)
    get:
      tags: [Kampagnen]
      summary: Vorschau einer Einladung, ohne Anmeldung (ab 0.4.10)
      description: |
        Damit die App vor dem Beitritt sagen kann, wohin es geht („Du trittst ‚Die leisen Wasser' bei“), auch wenn die
        Person noch kein Konto auf diesem Server hat. Liefert nur, was die Einladungsseite /einladung/{code} ohnehin
        zeigt: Kampagnentitel und – bei einer Platz-Einladung – den Namen der Figur. Keine Mitglieder, keine Inhalte.
        Unbekannte, abgelaufene oder aufgebrauchte Codes → 404 mit code `invite_invalid`. Fehlversuche zählen zur selben Begrenzung wie
        POST /campaigns/join (je Adresse) → 429 `too_many_requests`. Antwort mit `Cache-Control: no-store`.
      security: []
      responses:
        "200":
          description: Gültige Einladung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /campaigns/{campaignId}:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    delete:
      tags: [Kampagnen]
      summary: Kampagne endgültig löschen (nur SL, ab 0.4.5)
      description: |
        Löscht alles für alle: Kapitel, Recaps, Transkripte, Aufnahmen, Bibel, Unterlagen, Kommentare, Bilder, Termine.
        confirmTitle muss dem Titel entsprechen (400 confirmation_mismatch; Groß-/Kleinschreibung und doppelte
        Leerzeichen zählen nicht). Nicht rückgängig zu machen. Das Zustimmungsprotokoll bleibt als Nachweis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmTitle]
              properties:
                confirmTitle: { type: string }
      responses:
        "204": { description: Gelöscht }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Kampagnen]
      summary: Kampagne mit Mitgliedern
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Kampagnen]
      summary: Titel, Kurzbeschreibung oder Welt-Hintergrund ändern (nur SL)
      description: |
        Nur mitgeschickte Felder werden geändert. `worldInfo` ist für ALLE Mitglieder sichtbar
        (Spielerwissen über die Welt, Tischregeln). Geheimes gehört als gm_only-Eintrag in die Bibel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1 }
                description: { type: string }
                worldInfo: { type: string, description: "Fließtext, Absätze durch Leerzeilen getrennt" }
                language: { $ref: "#/components/schemas/ContentLanguage" }
                allowExternalTranscription: { type: boolean }
                allowCloudSummary: { type: boolean }
                hotwords:
                  type: array
                  maxItems: 200
                  items: { type: string, maxLength: 40 }
                  description: Namenshilfe ganz ersetzen (nur SL, ab 0.4.6). Doppelte und leere Einträge verwirft der Server.
                archived:
                  type: boolean
                  description: |
                    true = abschließen (archivedAt gesetzt): nur noch lesen und kommentieren, keine neuen Kapitel
                    (POST …/sessions → 409 campaign_archived), keine Terminabstimmung (POST …/date-poll → 409
                    campaign_archived; eine offene wird abgebrochen); false = wieder aufnehmen (ab 0.4.5)
                system:
                  oneOf:
                    - { $ref: "#/components/schemas/GameSystem" }
                    - { type: "null" }
                systemName: { type: [string, "null"], maxLength: 100 }
                coverPreset:
                  oneOf:
                    - { $ref: "#/components/schemas/CoverPreset" }
                    - { type: "null" }
                  description: Setzt ein mitgeliefertes Motiv (null = keins); ein eigenes Bild wird dabei gelöscht
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/invites:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    post:
      tags: [Kampagnen]
      summary: Einladungscode erzeugen (nur SL)
      responses:
        "201":
          description: Code erzeugt
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  expiresAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/members/{memberId}:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { $ref: "#/components/parameters/memberId" }
    delete:
      tags: [Kampagnen]
      summary: Mitglied entfernen (SL) oder die Kampagne selbst verlassen (eigene memberId) (ab 0.4.5)
      description: |
        Das Mitglied bleibt mit leftAt stehen (wie ein gelöschtes Konto), Kommentare und Charakterbild bleiben; es
        verliert den Zugriff (für die Person dann 404). Stehende Zustimmung (Widerruf wird protokolliert), Charakter-
        Hintergrund, Terminstimmen und Lesemarker werden gelöscht. Die letzte aktive SL kann weder gehen noch entfernt
        werden (409 last_gm). Wer über eine neue Einladung zurückkommt, wird als Spieler wieder aktiv (gleiche memberId).
      responses:
        "204": { description: Entfernt bzw. verlassen }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    patch:
      tags: [Kampagnen]
      summary: Charaktername oder Rolle ändern (Rolle nur durch SL)
      description: |
        Die letzte aktive SL kann nicht zum Spieler werden (409 last_gm). Wer SL wird, sieht ab sofort alles Geheime
        der Kampagne.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: |
                characterSummary und characterBackstory darf nur die Person selbst ändern (sonst 403).
                Leerer String löscht das Feld.
              properties:
                characterName: { type: string }
                characterSummary: { type: string, maxLength: 1000 }
                characterBackstory: { type: string, maxLength: 8000 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /campaigns/{campaignId}/members/me/character:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    put:
      tags: [Charaktere]
      summary: Eigenen Charakter setzen oder aktualisieren (ab 0.4.7)
      description: |
        Nur das Mitglied selbst. Ohne bisherigen Charakter (Altbestand, nach DELETE): übernimmt den Charakter und legt
        bzw. verknüpft den pc-Eintrag („in die Sammlung übernehmen“: neue UUID, version 1). Mit bisherigem Charakter:
        nur dieselbe id (sonst 409 character_mismatch) und nur eine höhere version (sonst 409 character_version_stale,
        details.serverVersion). Aktualisiert Member.character* und den pc-Eintrag. Die SL kann das nicht.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Character" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Charaktere]
      summary: Charakter lösen, z. B. für einen Charakterwechsel nach Tod oder Ruhestand (ab 0.4.7)
      description: |
        characterId wird gelöst; der pc-Eintrag bleibt mit holderMemberId null und dem letzten Status. Danach PUT mit
        dem neuen Charakter.
      responses:
        "204": { description: Gelöst }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /campaigns/{campaignId}/members/me/world:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Charaktere]
      summary: Stand aller je eingereichten mitgebrachten Einträge dieses Mitglieds (ab 0.4.7)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/WorldEntryStatus" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Charaktere]
      summary: Mitgebrachte Welt einreichen – wird zu Vorschlägen für die SL (ab 0.4.7)
      description: |
        Nur Mitglieder mit characterId (sonst 409 no_character); 1–100 Einträge (sonst 400 world_too_many). Je Eintrag:
        - unbekannte id → Vorschlag create, source character, suggestedVisibility public; bei secret
          hiddenFromMemberIds = alle anderen aktiven Mitglieder (die SL sieht es ohnehin)
        - bekannt, höhere version → Vorschlag update mit targetEntryId, detail = neue summary
        - bekannt, gleiche oder ältere version → unchanged
        - offener Vorschlag zu derselben id → wird durch den neuen ersetzt
        Nie direkt zu Einträgen; die SL entscheidet (GET /campaigns/{id}/character-proposals). Die Antwort nennt nur
        eigene Vorschläge und Zustände – Inhalte der Vorschläge bekommt die Person nicht.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/WorldEntryIn" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: { type: array, items: { $ref: "#/components/schemas/WorldEntryStatus" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /campaigns/{campaignId}/members/me/chronicle:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Charaktere]
      summary: Chronik des eigenen Charakters als Abschrift (ab 0.4.7)
      description: |
        Nur das Mitglied selbst, auch nach dem Verlassen (solange das Konto besteht). Die SL sieht keine Chroniken
        anderer (404). Nie enthalten: Transkripte, Hörproben, SL-Notizen, gm_only, Vorschläge, Namen anderer Personen
        (Charaktere anderer nur, soweit sie im Recap-Text stehen). Die App speichert die Abschrift in ihrer Sammlung;
        das Dateiformat ist Sache der App.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chronicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/character-proposals:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Vorschläge]
      summary: Vorschläge aus mitgebrachter Welt (nur SL, ab 0.4.7; Spieler 404)
      description: |
        Offene zuerst, danach die letzten 50 entschiedenen. Entscheiden per PATCH /proposals/{id}: bei source character
        wirkt accepted sofort (Eintrag wird angelegt bzw. ergänzt, mit originCharacterId/originEntryId/originVersion),
        rejected ebenso – es gibt kein Veröffentlichen wie bei Sessions. CampaignSummary.openCharacterProposals zählt
        die offenen.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Proposal" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/gm-notices/{noticeId}:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { name: noticeId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Kampagnen]
      summary: Hinweis an die SL erledigt (nur SL, ab 0.4.7)
      responses:
        "204": { description: Erledigt }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/members/me/move-consent:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    put:
      tags: [Umzug]
      summary: Zustimmung, dass die eigenen Charakterdaten bei einem Umzug mitgehen (ab 0.4.8)
      description: |
        Nur für sich selbst. Zustimmung und Widerruf werden protokolliert. Ohne Zustimmung geht nur der Platz mit
        (Rolle, characterId, Charaktername). Mit Zustimmung zusätzlich Kurzbeschreibung, Hintergrund, Spitzname,
        Status und Fassung des Charakters, Porträt, eigene öffentliche Kommentare, Charakterbögen; private Kommentare
        nur, wenn beide Beteiligten zugestimmt haben.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties:
                granted: { type: boolean }
      responses:
        "200":
          description: Eigenes Mitglied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/exports:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    post:
      tags: [Umzug]
      summary: Kampagne als Datei taleward-kampagne/1 packen (nur SL, ab 0.4.8)
      description: |
        Läuft als Auftrag auf dem Server (ohne Worker). Die Datei enthält gm_only-Inhalte und geht nur an die SL.
        Nie in der Datei: Anzeige- und Benutzernamen, E-Mail-Adressen, Konten, Einwilligungen, Stimmprofile,
        Transkripte, Hörproben, Audio, Recap.review, Vorschläge, Terminabstimmungen, Lesemarker, Nutzung, gmNotices.
        Unveröffentlichte Kapitel gehen nicht mit. Der Export ändert nichts an der Kampagne. Spieler 404.
      responses:
        "202":
          description: Gestartet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Es läuft schon ein Export (`export_running`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /campaigns/{campaignId}/exports/{exportId}:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { name: exportId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Umzug]
      summary: Stand des Exports (nur SL, ab 0.4.8; die App fragt alle paar Sekunden)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/exports/{exportId}/file:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { name: exportId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Umzug]
      summary: Datei herunterladen (nur SL, ab 0.4.8)
      description: |
        application/zip, Content-Disposition mit Dateiname `taleward-kampagne-<titel>-<datum>.zip`, Unterstützung für
        Range-Anfragen. Mit Bearer-Token oder mit dem Parameter `t` aus CampaignExport.downloadUrl (ohne Token, damit
        Browser und Android-Downloadmanager große Dateien direkt auf die Platte laden können).
      parameters:
        - name: t
          in: query
          required: false
          description: Download-Schlüssel aus CampaignExport.downloadUrl; gilt bis expiresAt, nur für diese Datei
          schema: { type: string }
      responses:
        "200":
          description: Die Datei
          content:
            application/zip:
              schema: { type: string, format: binary }
        "206": { description: Teil der Datei (Range) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: Datei schon gelöscht (`export_expired`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /imports:
    post:
      tags: [Umzug]
      summary: Import einer Datei taleward-kampagne/1 beginnen (jede angemeldete Person, ab 0.4.8)
      description: |
        Stückweiser Upload wie bei Aufnahmen. Größte Datei stellt der Betreiber ein (Standard 1 GB). Nicht
        abgeschlossene Importe löscht der Server nach 7 Tagen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, sizeBytes]
              properties:
                fileName: { type: string }
                sizeBytes: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema:
                type: object
                required: [importId, chunkSizeBytes, chunkCount]
                properties:
                  importId: { type: string }
                  chunkSizeBytes: { type: integer, example: 5242880 }
                  chunkCount: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Datei zu groß (`import_too_large`, details.maxBytes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /imports/{importId}:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Umzug]
      summary: Stand des Imports (nur die importierende Person, ab 0.4.8)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/{importId}/chunks/{index}:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string } }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    put:
      tags: [Umzug]
      summary: Einen Teil hochladen (idempotent, ab 0.4.8)
      parameters:
        - name: X-Chunk-SHA256
          in: header
          required: false
          description: Optional – SHA-256 des Teils (hex); falsch → 400 `chunk_checksum_mismatch`
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Teil gespeichert }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /imports/{importId}/complete:
    parameters:
      - { name: importId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Umzug]
      summary: Upload abschließen – Server prüft und legt die Kampagne an (ab 0.4.8)
      description: |
        Prüft die ZIP (Pfade, entpackte Gesamtgröße, Format), kodiert Bilder neu, prüft Unterlagen wie beim normalen
        Hochladen und legt eine neue, aktive Kampagne mit neuen IDs an. Die importierende Person wird einzige SL; alle
        Plätze der Datei werden offene Plätze (openSeat), Ehemalige kommen mit leftAt. Kapitelnummern bleiben.
      responses:
        "202":
          description: Prüfung läuft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Es fehlen noch Teile (details.missingChunks)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /campaigns/{campaignId}/members/{memberId}/invite:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { $ref: "#/components/parameters/memberId" }
    post:
      tags: [Umzug]
      summary: Einladung für genau diesen offenen Platz (nur SL, ab 0.4.8)
      description: |
        Für Plätze, die keine passende characterId abholt (Altbestand ohne Sammlung). Der Code gilt einmal und nur für
        diesen Platz; wer damit beitritt (POST /campaigns/join), sitzt auf dem Platz, mit oder ohne Charakter.
        Kein offener Platz → 409 seat_not_open.
      responses:
        "201":
          description: Code erzeugt
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  expiresAt: { type: string, format: date-time }
                  memberId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /campaigns/{campaignId}/members/{memberId}/take:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { $ref: "#/components/parameters/memberId" }
    post:
      tags: [Umzug]
      summary: „Das bin ich“ – die importierende SL setzt sich auf ihren alten Platz (ab 0.4.8)
      description: |
        Nur die Person, die importiert hat (sonst 403 not_importer), nur offene Plätze (sonst 409 seat_not_open). Das
        beim Import angelegte Mitglied geht im Platz auf; der Platz hat danach die Rolle gm.
      responses:
        "200":
          description: Die Kampagne mit aktualisierter Mitgliederliste
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /campaigns/{campaignId}/members/{memberId}/release:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { $ref: "#/components/parameters/memberId" }
    post:
      tags: [Umzug]
      summary: Eingenommenen Platz wieder freigeben (nur SL, ab 0.4.8)
      description: |
        Macht einen Platz wieder offen, z. B. wenn sich jemand auf den falschen gesetzt hat. Die Person verliert den
        Zugriff und kann mit einer neuen Einladung neu beitreten. Die letzte aktive SL kann nicht freigegeben werden
        (409 last_gm).
      responses:
        "200":
          description: Der Platz (openSeat true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /organizations:
    get:
      tags: [Kampagnen]
      summary: Eigene Organisationen (Verein, Laden, Gruppe)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /campaigns/{campaignId}/usage:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Kampagnen]
      summary: Verarbeitungsaufwand eines Monats (nur SL)
      parameters:
        - { name: month, in: query, description: "YYYY-MM, Standard: aktueller Monat",
            schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
        "400":
          description: month nicht im Format YYYY-MM (`validation_error`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/cover-image:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Kampagnen]
      summary: Eigenes Titelbild (alle Mitglieder; 404, wenn keins hochgeladen ist)
      description: Die App lädt das Bild mit Token und zeigt es lokal an; Cache-Schlüssel ist `coverImageUpdatedAt`.
      responses:
        "200":
          description: Bild
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Kampagnen]
      summary: Eigenes Titelbild hochladen oder ersetzen (nur SL)
      description: |
        Rohdaten im Body, Content-Type image/jpeg, image/png oder image/webp (sonst 400 `unsupported_image`),
        höchstens 5 MB (sonst 413 `image_too_large`). Die App verkleinert vorher auf 1600 px lange Kante.
        Der Server sollte das Bild neu kodieren (Metadaten wie GPS entfernen) und setzt `coverPreset` auf null.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    delete:
      tags: [Kampagnen]
      summary: Eigenes Titelbild löschen (nur SL)
      responses:
        "204": { description: Gelöscht }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/seen:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    post:
      tags: [Kampagnen]
      summary: Bereich als gelesen markieren (setzt den Marker des eigenen Mitglieds auf jetzt)
      description: |
        chronicle – die App hat die Chronik geöffnet: unread.recaps wird 0.
        bible – die App hat die Bibel geöffnet: unread.bible wird 0.
        Marker neuer Mitglieder starten beim Beitritt, damit alte Inhalte nicht als neu gelten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area]
              properties:
                area: { type: string, enum: [chronicle, bible] }
      responses:
        "204": { description: Gespeichert }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/members/{memberId}/portrait:
    parameters:
      - { $ref: "#/components/parameters/campaignId" }
      - { $ref: "#/components/parameters/memberId" }
    get:
      tags: [Kampagnen]
      summary: Charakterbild eines Mitglieds (alle Mitglieder der Kampagne; 404, wenn keins)
      parameters:
        - name: size
          in: query
          schema: { type: string, enum: [thumb, full], default: full }
          description: thumb = quadratisch 256×256 (mittig zugeschnitten) für die Kreise; full = bis 1024 px lange Kante
      responses:
        "200":
          description: Bild
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Kampagnen]
      summary: Eigenes Charakterbild hochladen oder ersetzen (nur für sich selbst)
      parameters:
        - { name: cropX, in: query, schema: { type: integer, minimum: 0 }, description: "Linke Kante des quadratischen Ausschnitts für thumb, in Pixeln des hochgeladenen Bildes" }
        - { name: cropY, in: query, schema: { type: integer, minimum: 0 } }
        - { name: cropSize, in: query, schema: { type: integer, minimum: 1 }, description: "Kantenlänge des Ausschnitts; ohne Angabe mittig zugeschnitten" }
      description: |
        JPEG, PNG oder WebP, höchstens 3 MB (die App verkleinert vorher auf 1024 px lange Kante, JPEG 85 %,
        typisch 80–250 kB). Der Server kodiert neu, entfernt Metadaten, speichert full (≤ 1024 px) und
        thumb (256×256 aus dem Ausschnitt cropX/cropY/cropSize, sonst mittig; Ausschnitt außerhalb des Bildes → 400)
        und setzt `Member.portraitUpdatedAt`. full ist immer das ganze Bild.
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: OK – das eigene Mitglied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    delete:
      tags: [Kampagnen]
      summary: Charakterbild löschen (eigenes; die SL darf zur Moderation jedes löschen)
      responses:
        "204": { description: Gelöscht }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/recording-consent:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    put:
      tags: [Kampagnen]
      summary: Eigene stehende Zustimmung zu Aufnahmen setzen oder widerrufen
      description: |
        Nur für sich selbst. `granted: true` setzt `recordingConsentAt` auf jetzt, `false` löscht es.
        Ein Widerruf gilt sofort: Uploads von Sessions, bei denen die Person mit `consentSource: app`
        anwesend war und die noch nicht hochgeladen sind, werden mit 409 `consent_revoked` abgelehnt.
        Bereits veröffentlichte Recaps bleiben bestehen. Der Server sollte Zustimmung und Widerruf mit
        Zeitpunkt protokollieren (Nachweis).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties:
                granted: { type: boolean }
      responses:
        "200":
          description: OK – das eigene Mitglied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/sessions:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Sessions]
      summary: Sessions der Kampagne (Spieler sehen nur veröffentlichte)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Sessions]
      summary: Session (Kapitel) anlegen, vor der Aufnahme
      description: Legt Anwesende und Einwilligungen fest. Ohne vollständige Einwilligung ist kein Upload möglich.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [playedAt, attendees]
              properties:
                title: { type: string, description: "Optional, sonst schlägt der Server einen Titel vor" }
                playedAt: { type: string, format: date-time }
                attendees:
                  type: array
                  items: { $ref: "#/components/schemas/Attendee" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    delete:
      tags: [Sessions]
      summary: Unveröffentlichtes Kapitel verwerfen (nur SL, ab 0.4.5)
      description: |
        Löscht Session samt Upload-Teilen, Audio, Transkript, Hörproben, Vorschlägen und Recap-Entwurf; laufende Aufträge
        werden abgebrochen. Veröffentlichte Kapitel → 409 session_published. Die Kapitelnummer wird wieder frei: spätere
        Kapitel rücken um eins auf (App lädt die Kapitelliste danach neu).
      responses:
        "204": { description: Verworfen }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Sessions]
      summary: Session-Details inkl. Verarbeitungsstatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Sessions]
      summary: Anwesende/Einwilligungen oder Titel ändern (nur SL, nur vor dem Upload für Einwilligungen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                attendees:
                  type: array
                  items: { $ref: "#/components/schemas/Attendee" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/status:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Sessions]
      summary: Verarbeitungsstatus (App fragt z. B. alle 30 s ab)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionId}/retry:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Sessions]
      summary: Fehlgeschlagene Verarbeitung neu starten (nur SL)
      description: |
        Nur im Zustand `failed`. Setzt dort wieder an, wo es schiefging: bei gescheiterter Transkription
        (solange das Audio noch da ist, höchstens 7 Tage), sonst bei der Zusammenfassung.
        Ist das Audio schon gelöscht und die Transkription gescheitert, kommt 409 `audio_gone` – dann neu hochladen.
      responses:
        "202":
          description: Neu eingereiht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/resummarize:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Sessions]
      summary: Kapitel aus der vorhandenen Abschrift neu schreiben (nur SL, ab 0.4.10)
      description: |
        Nur im Zustand `awaiting_review`. Schreibt Recap, offene Fäden, Vorschläge und Prüfteil neu – aus der
        vorhandenen Abschrift mit den aktuellen Korrekturen und der aktuellen Stimmenzuordnung, mit dem Stand des
        Servers von jetzt (z. B. nach einem Update). Kein neues Hochladen, das Audio wird nicht gebraucht.
        Verworfen werden: Bearbeitungen am Recap-Entwurf und alle Entscheidungen zu Vorschlägen dieses Kapitels
        (sie wirken ohnehin erst beim Veröffentlichen). Bleiben: SL-Notiz, Korrekturen, Stimmenzuordnung,
        Anwesenheit, Kommentare. Die Session geht nach `summarizing`, danach wieder `awaiting_review`.
        Kostet wie eine neue Zusammenfassung (Usage) und folgt der Cloud-Freigabe der Kampagne.
        Andere Zustände → 409 `wrong_state`; Abschrift fehlt → 409 `transcript_missing`.
      responses:
        "202":
          description: Neu eingereiht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/uploads:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Upload]
      summary: Upload starten
      description: |
        Stückweiser Upload, damit lange Aufnahmen auch über wackeliges WLAN/Mobilfunk ankommen.
        Formate: AAC in MP4/M4A (Android-App, mono, 32 kHz, 48 kbit/s) oder Opus in WebM/Ogg (Browser).
        Für source=table: Mehrere Dateien sind aufeinanderfolgende Abschnitte EINER Aufnahme
        (die Android-App teilt alle ~5 Minuten). Der Server hängt sie in der Reihenfolge des
        files-Arrays lückenlos aneinander, bevor er transkribiert.
        Für source=discord: eine Datei pro Spur, jeweils mit `trackMemberId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, files]
              properties:
                source: { type: string, enum: [table, discord] }
                files:
                  type: array
                  items:
                    type: object
                    required: [fileName, sizeBytes, mimeType]
                    properties:
                      fileName: { type: string }
                      sizeBytes: { type: integer }
                      mimeType: { type: string, example: "audio/ogg" }
                      trackMemberId:
                        type: string
                        description: Nur bei source=discord – welches Mitglied auf dieser Spur spricht
      responses:
        "201":
          description: Upload angelegt
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string }
                  chunkSizeBytes: { type: integer, example: 5242880 }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId: { type: string }
                        fileName: { type: string }
                        chunkCount: { type: integer }
        "409":
          description: |
            Nicht alle Anwesenden haben eingewilligt (`consent_missing`), eine App-Zustimmung wurde inzwischen
            widerrufen (`consent_revoked`), oder es läuft bereits ein anderer Upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /uploads/{uploadId}/files/{fileId}/chunks/{index}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
      - { name: fileId, in: path, required: true, schema: { type: string } }
      - { name: index, in: path, required: true, schema: { type: integer, minimum: 0 } }
    put:
      tags: [Upload]
      summary: Einen Teil hochladen (idempotent, darf wiederholt werden)
      parameters:
        - name: X-Chunk-SHA256
          in: header
          required: false
          description: Optional – SHA-256 des Teils (hex). Stimmt er nicht, antwortet der Server mit 400 `chunk_checksum_mismatch`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Teil gespeichert }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /uploads/{uploadId}:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Upload]
      summary: Welche Teile fehlen noch (zum Fortsetzen nach Abbruch)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId: { type: string }
                        missingChunks: { type: array, items: { type: integer } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /uploads/{uploadId}/complete:
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Upload]
      summary: Upload abschließen, Verarbeitung einreihen
      responses:
        "202":
          description: Eingereiht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingStatus" }
        "409":
          description: Es fehlen noch Teile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionId}/speakers:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Stimmen]
      summary: Erkannte Stimmen mit Zuordnungsvorschlag (nur SL)
      description: |
        Bei source=discord sind alle Stimmen bereits zugeordnet, der Schritt entfällt.
        Ab 0.4.10 auch nach der Bestätigung (summarizing, awaiting_review, published), solange die Abschrift da ist;
        dann mit assignedMemberId bzw. assignedGuestName.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Speaker" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Stimmen]
      summary: Zuordnung bestätigen, danach startet die Zusammenfassung
      description: |
        In `awaiting_speakers`. Ab 0.4.10 auch in `awaiting_review`: ändert die Zuordnung und schreibt das Kapitel neu
        (wie POST …/resummarize, mit denselben Folgen für Recap-Bearbeitungen und Entscheidungen). Andere Zustände →
        409 `wrong_state`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [speakerId]
                properties:
                  speakerId: { type: string }
                  memberId:
                    type: [string, "null"]
                    description: null = Gast (mit guestName) oder ignorieren (ohne)
                  guestName:
                    type: [string, "null"]
                    description: |
                      Ab 0.4.7: einer der guestName-Werte der Anwesenden. Der Server schreibt ihn als Sprecher ins
                      Transkript („Mira (Gast)“) und in die Eingabe der Zusammenfassung. Schließt memberId aus (400);
                      beide null = ignorieren. Kein Stimmprofil für Gäste.
      responses:
        "202":
          description: Zusammenfassung eingereiht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/speakers/{speakerId}/sample:
    parameters:
      - { $ref: "#/components/parameters/sessionId" }
      - { name: speakerId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Stimmen]
      summary: Kurze Hörprobe (wenige Sekunden, wird mit dem Audio gelöscht)
      responses:
        "200":
          description: Audio
          content:
            audio/ogg:
              schema: { type: string, format: binary }
        "410":
          description: Hörprobe bereits gelöscht (`audio_deleted`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionId}/proposals:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Vorschläge]
      summary: Bibel-Vorschläge der Session (nur SL)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Proposal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /proposals/{proposalId}:
    parameters:
      - { name: proposalId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Vorschläge]
      summary: Vorschlag übernehmen, verwerfen oder vor dem Übernehmen bearbeiten (nur SL)
      description: |
        Bei Session-Vorschlägen wirkt die Entscheidung beim Veröffentlichen, bei Unterlagen mit …/apply. Bei source
        character (ab 0.4.7) wirkt accepted bzw. rejected sofort.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string, enum: [open, accepted, rejected] }
                title: { type: string }
                detail: { type: string }
                gmNotes: { type: string, description: "Geheimer Teil; leerer String löscht ihn" }
                visibility: { $ref: "#/components/schemas/Visibility" }
                hiddenFromMemberIds: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Proposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/recap:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Chronik]
      summary: Recap (Spieler erst nach Veröffentlichung)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recap" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Chronik]
      summary: Recap vor der Veröffentlichung bearbeiten (nur SL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                text: { type: string }
                openThreads: { type: array, items: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recap" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/publish:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Chronik]
      summary: Veröffentlichen (nur SL)
      description: |
        Übernimmt alle akzeptierten Vorschläge in die Bibel und macht den Recap für Spieler sichtbar.
        Noch offene Vorschläge werden als verworfen behandelt.
      responses:
        "200":
          description: Veröffentlicht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/gm-note:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Chronik]
      summary: Geheime SL-Notiz (nur SL, fließt nie in Recaps ein)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Chronik]
      summary: SL-Notiz speichern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "204": { description: Gespeichert }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionId}/uncertain-terms:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Chronik]
      summary: Unsicher erkannte Namen und Begriffe (nur SL, ab 0.4.6; Spieler 404)
      description: |
        Aus den Wort-Sicherheiten der Transkription, gebündelt je Schreibweise; nur Großgeschriebenes und Wörter, die
        nicht im Wörterbuch der Sprache stehen; nach Häufigkeit sortiert. Ähnlich klingende Bibel- und Charakternamen
        kommen als Vorschlag mit. Leere Liste = nichts zu prüfen (die App überspringt dann den Schritt).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  audioAvailable: { type: boolean, description: "Audio noch da → erneute Transkription möglich" }
                  audioDeletesAt: { type: [string, "null"], format: date-time }
                  retranscribesLeft: { type: integer, description: "Wie oft noch erneut transkribiert werden darf (höchstens 2 je Session)" }
                  terms:
                    type: array
                    items: { $ref: "#/components/schemas/UncertainTerm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionId}/corrections:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Chronik]
      summary: Schreibweisen korrigieren, optional erneut transkribieren (nur SL, ab 0.4.6)
      description: |
        Nur in awaiting_review (und failed nach der Zusammenfassung), sonst 409 `wrong_state`.
        retranscribe false: Textersetzung in Transkript, Recap-Entwurf und Vorschlägen; die Prüfung (review) wird neu
        berechnet → 200 mit dem Recap.
        retranscribe true: nur solange audioAvailable (sonst 409 `audio_gone`), höchstens zweimal je Session
        (409 `retranscribe_limit`). Zustand geht auf transcribing, die Stimmzuordnung bleibt, danach summarizing und
        wieder awaiting_review → 202 mit ProcessingStatus samt estimatedSeconds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [corrections]
              properties:
                corrections:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [heard, correct]
                    properties:
                      heard: { type: string }
                      correct: { type: string, description: "Leer = Begriff so lassen, nur nicht mehr melden" }
                      addToHotwords: { type: boolean, default: true, description: "Künftig als Namenshilfe der Kampagne" }
                retranscribe: { type: boolean, default: false }
      responses:
        "200":
          description: Ersetzt (ohne retranscribe) – der aktualisierte Recap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recap" }
        "202":
          description: Eingereiht (retranscribe)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcessingStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/transcript:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Chronik]
      summary: Transkript (nur SL)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    start: { type: number, description: Sekunden }
                    end: { type: number }
                    speakerId: { type: string }
                    memberId: { type: [string, "null"] }
                    text: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/date-poll:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Termine]
      summary: Aktuelle Terminabstimmung (die offene, sonst die zuletzt beendete; abgebrochene zählen nicht)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePoll" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Kampagne unbekannt, oder es gibt keine Abstimmung (`no_date_poll`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      tags: [Termine]
      summary: Terminabstimmung starten (nur SL; 409 `date_poll_open`, wenn schon eine läuft; 409 `campaign_archived`)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: "Hinweis für alle, z. B. welches Kapitel" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePoll" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /date-polls/{pollId}:
    parameters: [{ $ref: "#/components/parameters/pollId" }]
    delete:
      tags: [Termine]
      summary: Offene Abstimmung abbrechen (nur SL)
      responses:
        "204": { description: Abgebrochen }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /date-polls/{pollId}/options:
    parameters: [{ $ref: "#/components/parameters/pollId" }]
    post:
      tags: [Termine]
      summary: Termin vorschlagen (alle Mitglieder)
      description: |
        Nur bei offener Abstimmung (sonst 409 `date_poll_closed`). Termine in der Vergangenheit: 400 `date_in_past`.
        Gleicher Zeitpunkt doppelt: 409 `option_exists`. Wer vorschlägt, hat für diesen Termin automatisch "yes" gestimmt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startsAt]
              properties:
                startsAt: { type: string, format: date-time }
      responses:
        "201":
          description: Vorgeschlagen, liefert die ganze Abstimmung
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePoll" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /date-polls/{pollId}/options/{optionId}:
    parameters:
      - { $ref: "#/components/parameters/pollId" }
      - { name: optionId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Termine]
      summary: Vorschlag entfernen (wer ihn vorgeschlagen hat, oder SL)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePoll" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /date-polls/{pollId}/options/{optionId}/vote:
    parameters:
      - { $ref: "#/components/parameters/pollId" }
      - { name: optionId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Termine]
      summary: Eigene Antwort zu einem Termin setzen oder ändern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { $ref: "#/components/schemas/VoteAnswer" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePoll" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /date-polls/{pollId}/close:
    parameters: [{ $ref: "#/components/parameters/pollId" }]
    post:
      tags: [Termine]
      summary: Termin festlegen und Abstimmung beenden (nur SL)
      description: Setzt `nextSessionAt` der Kampagne auf den gewählten Termin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionId]
              properties:
                optionId: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePoll" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /sessions/{sessionId}/seen:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    post:
      tags: [Kommentare]
      summary: Kommentare dieses Kapitels als gelesen markieren (die App ruft das beim Öffnen des Recaps auf)
      responses:
        "204": { description: Gespeichert }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /sessions/{sessionId}/comments:
    parameters: [{ $ref: "#/components/parameters/sessionId" }]
    get:
      tags: [Kommentare]
      summary: Kommentare zu einem Kapitel (Spieler nur bei veröffentlichten Kapiteln, sonst 404)
      description: |
        Liefert öffentliche Kommentare und nur die privaten, die man selbst geschrieben oder bekommen hat.
        Das gilt auch für die SL (bei mehreren SLs sieht jede nur ihre eigenen privaten Nachrichten).
        Aufsteigend nach createdAt. Kommentare fließen nie in Recaps oder Vorschläge ein.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Comment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Kommentare]
      summary: Kommentieren oder privat schreiben
      description: |
        `recipientMemberId` leer = für alle. Gesetzt = privat, sichtbar nur für Absender und Empfänger.
        Spieler dürfen privat nur an die SL schreiben (sonst 403), die SL an jede Person.
        Leerer Text 400, mehr als 4000 Zeichen 413 `comment_too_long`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
                recipientMemberId: { type: [string, "null"] }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /comments/{commentId}:
    parameters:
      - { name: commentId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Kommentare]
      summary: Eigenen Kommentar bearbeiten (setzt editedAt)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
    delete:
      tags: [Kommentare]
      summary: Löschen (eigene; die SL auch alle, die sie sehen kann)
      responses:
        "204": { description: Gelöscht }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /campaigns/{campaignId}/documents:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Unterlagen]
      summary: Hochgeladene Unterlagen (SL alle; Spieler ab 0.4.7 nur eigene Charakterbögen, vorher 403)
      responses:
        "200":
          description: OK, neueste zuerst
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Unterlagen]
      summary: Unterlage hochladen und Auswertung einreihen (nur SL; character_sheet jedes aktive Mitglied)
      description: |
        Ab 0.4.7 darf jedes aktive Mitglied kind character_sheet hochladen (Charakterbogen). Sichtbar nur für die SL und
        die hochladende Person (GET-Liste für Spieler: nur eigene character_sheet; alle anderen 404). Wird nie
        ausgewertet und fließt nie in Recaps oder Vorschläge.

        PDF, Word (.docx), .txt oder .md bis 50 MB (sonst 400 `unsupported_document` bzw. 413 `document_too_large`).
        Der Server extrahiert den Text (Seitenzahlen merken), zerlegt ihn in Abschnitte und lässt das Sprachmodell
        Bibel-Vorschläge erstellen – mit der vorhandenen Bibel (inkl. gmNotes) als Kontext, damit es ergänzt statt
        doppelt anlegt (action update, targetEntryId) und Widersprüche markiert (contradicts_bible).

        Trennung SL-/Spielerwissen (verbindlich):
        - kind handout: suggestedVisibility public, keine gmNotes.
        - kind gm: jeder Vorschlag gm_only.
        - kind mixed: ebenfalls gm_only; hält die KI einen Eintrag für Spielerwissen, setzt sie publicSuggested=true
          mit visibilityReason. Freigeben muss die SL selbst.
        - Innerhalb eines Eintrags trennt die KI jede Aussage in detail (Spielerwissen) und gmNotes (geheim).
          Abschnitte mit Markierungen wie „[SL]“, „[GM]“, „Geheim:“, „Secret:“ gehen immer in gmNotes.
        - Ergänzt ein Vorschlag einen öffentlichen Eintrag, kommt Neues aus gm/mixed-Unterlagen in gmNotes;
          detail bleibt der bisherige öffentliche Text.
        Zusätzlich optional worldInfoSuggestion: kurzer Welt-Hintergrund nur aus Spielerwissen (nicht bei kind gm).
        Die Datei bleibt nur für die SL gespeichert, bis sie gelöscht wird. Eingescannte Seiten ohne Textebene: noch
        keine Texterkennung – dann message mit Hinweis.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind: { $ref: "#/components/schemas/DocumentKind" }
                title: { type: string }
      responses:
        "201":
          description: Angelegt und eingereiht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /documents/{documentId}:
    parameters: [{ $ref: "#/components/parameters/documentId" }]
    get:
      tags: [Unterlagen]
      summary: Status einer Unterlage (nur SL; für andere 404)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Unterlagen]
      summary: Unterlage samt Datei und offenen Vorschlägen löschen (übernommene Bibeleinträge bleiben)
      responses:
        "204": { description: Gelöscht }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/proposals:
    parameters: [{ $ref: "#/components/parameters/documentId" }]
    get:
      tags: [Unterlagen]
      summary: Bibel-Vorschläge aus der Unterlage (nur SL); bearbeitet werden sie wie bei Sessions über PATCH /proposals/{id}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Proposal" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /documents/{documentId}/apply:
    parameters: [{ $ref: "#/components/parameters/documentId" }]
    post:
      tags: [Unterlagen]
      summary: Angenommene Vorschläge in die Bibel übernehmen (nur SL, nur im Zustand awaiting_review)
      description: |
        Offene Vorschläge gelten als verworfen. Bei update werden gmNotes an vorhandene gmNotes angehängt.
        applyWorldInfo=true hängt worldInfoSuggestion an Campaign.worldInfo an. Danach state done.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                applyWorldInfo: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /documents/{documentId}/retry:
    parameters: [{ $ref: "#/components/parameters/documentId" }]
    post:
      tags: [Unterlagen]
      summary: Fehlgeschlagene Auswertung neu starten (nur SL, nur bei failed; sonst 409)
      responses:
        "202":
          description: Neu eingereiht
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /campaigns/{campaignId}/entries:
    parameters: [{ $ref: "#/components/parameters/campaignId" }]
    get:
      tags: [Bibel]
      summary: Bibel-Einträge (gm_only wird für Spieler serverseitig ausgefiltert)
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/EntryType" } }
        - { name: q, in: query, description: Volltextsuche, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Bibel]
      summary: Eintrag von Hand anlegen (nur SL)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "201":
          description: Angelegt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /entries/{entryId}:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Bibel]
      summary: Eintrag mit Verlauf (in welchen Kapiteln erwähnt)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Bibel]
      summary: Eintrag bearbeiten, freigeben oder zurückziehen (nur SL)
      description: |
        Nur mitgeschickte Felder ändern sich. visibility public ohne öffentlichen Text (summary leer) → 400.
        Freigeben heißt: summary wird für Spieler sichtbar, gmNotes bleibt geheim. Zurück auf gm_only ist erlaubt
        (Spieler sehen den Eintrag dann nicht mehr).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Bibel]
      summary: Eintrag löschen (nur SL)
      responses:
        "204": { description: Gelöscht }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /entries/{entryId}/to-npc:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Bibel, Charaktere]
      summary: Figur eines ausgetretenen Spielers als NSC weiterführen (nur SL, ab 0.4.9)
      description: |
        Erlaubt für Einträge type pc, deren Halter die Kampagne verlassen hat (leftAt), dessen Konto gelöscht ist
        (deletedAt) oder ohne Halter (holderMemberId null). Wirkung: type npc, holderMemberId null,
        formerHolderMemberId = bisheriger Halter. Name, Kurzbeschreibung, Status, Sichtbarkeit, Erwähnungen und
        Kapitel bleiben; danach ein normaler NSC (PATCH, DELETE wie immer). Das Porträt bleibt am ausgetretenen
        Mitglied (Einträge haben keine Bilder). Halter noch aktiv → 409 `holder_active`; kein pc-Eintrag → 409
        `not_a_character`. Spieler → 403, fremde Einträge → 404.
      responses:
        "200":
          description: Jetzt ein NSC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /entries/{entryId}/assign:
    parameters:
      - { name: entryId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Bibel, Charaktere]
      summary: Figur einem anderen Spieler geben (nur SL, ab 0.4.9)
      description: |
        Erlaubt für npc-Einträge mit formerHolderMemberId (aus einer Spielerfigur entstanden) und für pc-Einträge ohne
        aktiven Halter. Ziel: aktives Mitglied mit Rolle player ohne eigenen pc-Eintrag. Wirkung: type pc,
        holderMemberId = Ziel; Member.characterName und characterSummary des Ziels werden aus dem Eintrag gesetzt.
        characterId bleibt null, bis die Person die Figur in ihre Sammlung übernimmt (PUT …/members/me/character mit
        neuer id, version 1); der Server verknüpft dann den vorhandenen pc-Eintrag, statt einen neuen anzulegen.
        Alte Recaps bleiben unverändert, Erwähnungen wandern mit dem Eintrag. Fehler: Ziel hat schon einen pc-Eintrag →
        409 `member_has_character`; Ziel kein aktiver Spieler → 409 `not_a_player`; Eintrag passt nicht → 409
        `not_a_character`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId: { type: string }
      responses:
        "200":
          description: Figur übergeben
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    campaignId: { name: campaignId, in: path, required: true, schema: { type: string } }
    sessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
    memberId: { name: memberId, in: path, required: true, schema: { type: string } }
    pollId: { name: pollId, in: path, required: true, schema: { type: string } }
    documentId: { name: documentId, in: path, required: true, schema: { type: string } }

  responses:
    Unauthorized:
      description: Nicht angemeldet
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Keine Berechtigung (z. B. Spieler auf SL-Endpunkt)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Nicht gefunden (auch für Inhalte, die der Nutzer nicht sehen darf)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: Ungültige Eingabe
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Im aktuellen Zustand nicht möglich (z. B. falscher Verarbeitungsstatus)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayloadTooLarge:
      description: Datei oder Teil zu groß
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: Zu viele Versuche (`too_many_requests`); message sagt, wie lange zu warten ist
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: "consent_missing" }
        message: { type: string, description: "Für Nutzer lesbar, in der Sprache aus Accept-Language (Standard: Deutsch)" }
        details:
          type: object
          additionalProperties: true
          description: Zusätzliche Angaben je Fehlercode (ab 0.4.7), z. B. character_version_stale → { serverVersion }

    ServerInfo:
      type: object
      properties:
        name: { type: string }
        operator: { type: string }
        contact: { type: [string, "null"] }
        apiVersion: { type: string, example: "0.3.8" }
        registration: { type: string, enum: [invite_only, closed] }
        authMethods: { type: array, items: { type: string, enum: [password, oidc, passkey] }, description: "oidc, sobald mindestens ein Dienst eingerichtet ist" }
        privacyPolicyUrl: { type: [string, "null"] }
        minAge: { type: integer, example: 16 }
        minAppVersion: { type: [string, "null"], example: "0.10.0", description: "Ältere Apps bekommen 426 app_outdated; null = keine Grenze" }
        latestAppVersion: { type: [string, "null"], example: "0.9.1", description: "Neueste App – die App zeigt „Neue Version“" }
        appDownloadUrl: { type: [string, "null"], description: "APK- oder Store-Link; auch für die Einladungsseite" }
        releaseNotes: { type: [string, "null"], description: "Kurz, was neu ist (ein paar Zeilen)" }
        appDownloadSha256: { type: [string, "null"], description: "SHA-256 (hex) der APK unter appDownloadUrl – nur, wenn der Server die Datei selbst anbietet (ab 0.4.1)" }
        appDownloadSizeBytes: { type: [integer, "null"], description: "Größe der APK in Bytes (ab 0.4.1)" }
        audioRetention:
          type: object
          description: |
            Wie lange das Session-Audio auf dem Server bleibt (ab 0.4.4, Einstellung in der Verwaltung). until_release =
            bis die SL den Recap veröffentlicht, höchstens maxDays Tage (Standard für neue Server: 7), danach löscht ein
            geplanter Job es und setzt audioDeletedAt. immediate = gleich nach der Transkription (maxDays null).
            Hörproben pro Sprecher und Stimmprofile sind davon unabhängig. Ab 0.4.4 immer vorhanden; fehlt das Feld
            (ältere Server), geht die App von immediate aus. Wird die Aufbewahrung verlängert (immediate → until_release
            oder mehr Tage), setzt der Server recordingConsentAt aller Mitglieder zurück.
          properties:
            mode: { type: string, enum: [until_release, immediate] }
            maxDays: { type: [integer, "null"], minimum: 1, maximum: 7, example: 7 }
        authProviders:
          type: array
          description: Eingerichtete Anmeldedienste (ab 0.4.0) – die App zeigt genau diese Knöpfe. Leer = keine.
          items:
            type: object
            properties:
              id: { type: string, enum: [google, discord, apple, microsoft] }
              name: { type: string, example: Google }
        passwordReset:
          type: boolean
          description: true, wenn der Server E-Mails verschicken kann – dann zeigt die App „Passwort vergessen?“ (ab 0.4.0)
        externalTranscriptionMode:
          type: [string, "null"]
          enum: [fallback, primary, null]
          description: |
            fallback = externe Transkription erst, wenn 24 h kein Worker erreichbar war (Standard);
            primary = Betriebsart „Nur Cloud“, Aufnahmen gehen ohne Wartezeit dorthin. null, wenn externalTranscription null.
        cloudSummary:
          type: [string, "null"]
          description: |
            Anbieter der Cloud-Zusammenfassung (z. B. "mistral"), wenn der Betreiber eine API eingerichtet hat; null = nur
            lokales Modell. Nur dann zeigt die App der SL den Schalter allowCloudSummary.
        externalTranscription:
          type: [string, "null"]
          description: |
            null = dieser Server transkribiert nur selbst. Sonst Name des externen Anbieters (z. B. "mistral"),
            den der Betreiber als Ersatz freigegeben hat. Nur dann zeigt die App der SL den Schalter
            allowExternalTranscription und nennt den Anbieter im Hinweis.
        cloudSummaryInfo:
          description: |
            Ab 0.4.11. Angaben zum Anbieter aus cloudSummary für die Anzeige am Tisch und im Einwilligungstext;
            null, wenn cloudSummary null ist.
          oneOf:
            - $ref: "#/components/schemas/CloudProviderInfo"
            - type: "null"
        externalTranscriptionInfo:
          description: Ab 0.4.11. Wie cloudSummaryInfo, für externalTranscription; null, wenn externalTranscription null ist.
          oneOf:
            - $ref: "#/components/schemas/CloudProviderInfo"
            - type: "null"

    CloudProviderInfo:
      type: object
      description: |
        Ab 0.4.11. Wer Text (Zusammenfassung) bzw. Aufnahmen (Transkription) verarbeitet. Ohne sprachabhängige Wörter,
        damit die App sie in jeder Sprache gleich zeigen kann; Land und „EU“ übersetzt die App.
      required: [id, name, region]
      properties:
        id: { type: string, description: 'Kennung wie in cloudSummary bzw. externalTranscription', example: mistral }
        name: { type: string, description: Anzeigename des Anbieters, example: Mistral AI }
        region: { type: string, enum: [eu, non_eu], description: 'Verarbeitung in der EU (eu) oder außerhalb (non_eu)' }
        country:
          type: [string, "null"]
          description: Land der Verarbeitung als ISO-3166-1-alpha-2-Code; null = unbekannt
          example: FR

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        myRole: { type: string, enum: [admin, member] }

    Usage:
      type: object
      properties:
        month: { type: string, example: "2026-09" }
        sessions: { type: integer }
        audioSeconds: { type: integer }
        documents: { type: integer }
        costEstimateCents: { type: [integer, "null"] }
        billedTo: { type: string, enum: [gm, organization] }

    DocumentKind:
      type: string
      enum: [handout, gm, mixed, character_sheet]
      description: |
        handout = Spielerhandout (öffentlich), gm = SL-Unterlage (alles geheim), mixed = gemischt (geheim mit
        Freigabe-Vorschlägen), character_sheet = Charakterbogen eines Mitglieds (ab 0.4.7; nur SL und Urheberin, keine
        Auswertung)

    CampaignDocument:
      type: object
      properties:
        id: { type: string }
        campaignId: { type: string }
        title: { type: string }
        fileName: { type: string }
        kind: { $ref: "#/components/schemas/DocumentKind" }
        sizeBytes: { type: integer }
        pageCount: { type: [integer, "null"] }
        state: { type: string, enum: [queued, processing, awaiting_review, done, failed] }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        message: { type: [string, "null"] }
        proposalCount: { type: integer }
        openProposalCount: { type: integer }
        worldInfoSuggestion: { type: [string, "null"] }
        uploadedByMemberId: { type: [string, "null"], description: "Ab 0.4.7; bei character_sheet die Urheberin" }
        createdAt: { type: string, format: date-time }

    CoverPreset:
      type: string
      description: |
        Mitgelieferte Titelbilder der App (die Bilder selbst liegen in der App, nicht auf dem Server). Die IDs bleiben
        für immer gleich; neue kommen nur hinzu. Neue Kampagnen ohne Angabe: zufällig aus dieser Liste. Ab 0.4.3 sind es
        30 Bilder; ältere Apps kennen nur die ersten elf und zeigen bei unbekannten IDs kein Titelbild.
      enum: [meadow, forest, desert, city, cyber, mountains, coast, swamp, dungeon, space, castle, dark-fantasy, moonwood, ancient-ruins, tavern, battlefield, frozen-north, arcane-ruins, fairy-wilds, underworld, storm-coast, steampunk, post-apocalypse, western, noir, space-opera, orient, necropolis, manor, riverside-mystery]

    GameSystem:
      type: string
      enum: [dsa, dnd, pathfinder, cthulhu, shadowrun, splittermond, other]
      description: |
        Spielsystem der Kampagne. Für die großen Systeme hinterlegt der Server eine kleine Begriffsliste
        (Orte, Götter, Fachbegriffe), die bei der Transkription als Schreibhilfe dient. `other` löst keine
        Liste aus – dann kommen alle Namen aus der Kampagne selbst (Charaktere, Bibel, worldInfo, Unterlagen).
        Bei PATCH ändert nur ein mitgeschicktes Feld etwas, `null` leert es. Ohne Angabe gilt `system: null`,
        behandelt wie `other`.

    ContentLanguage:
      type: string
      enum: [de, en]
      default: de
      description: Sprache der Spielrunde – steuert Transkription, Recaps, Vorschläge und den Vorlesetext fürs Stimmprofil

    Role:
      type: string
      enum: [gm, player]

    Visibility:
      type: string
      enum: [public, gm_only]

    EntryType:
      type: string
      enum: [npc, location, quest, item, faction, other, pc]
      description: |
        pc (ab 0.4.7) = Spielercharakter. Legt nur der Server an (beim Beitritt mit Charakter oder PUT …/character),
        hält name/summary synchron mit der Serverkopie; holderMemberId = das Mitglied (null nach Charakterwechsel).
        Nicht per POST /entries anlegbar (400); keine Vorschläge dafür. Ältere Apps zeigen ihn wie other.

    User:
      type: object
      description: Die Felder ab email bekommt nur die Person selbst (GET /me, Login, Registrierung, Tausch), nie andere.
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        email: { type: [string, "null"], description: "Bestätigte Adresse (ab 0.4.0)" }
        emailPending: { type: [string, "null"], description: "Eingetragen, aber noch nicht bestätigt (ab 0.4.0)" }
        hasPassword: { type: boolean, description: "false bei Konten, die nur über einen Dienst angelegt wurden (ab 0.4.0)" }
        providers: { type: array, items: { type: string, enum: [google, discord, apple, microsoft] }, description: "Verbundene Dienste (ab 0.4.0)" }

    VoiceProfile:
      type: object
      properties:
        status: { type: string, enum: [none, processing, ready, failed] }
        createdAt: { type: [string, "null"], format: date-time }
        sampleSeconds: { type: [number, "null"] }
        learnFromSessions:
          type: boolean
          description: Nach jeder von der SL bestätigten Stimmzuordnung lernt das Profil aus der echten Tischaufnahme dazu
        learnedSessionCount: { type: integer }
        message: { type: [string, "null"], description: "z. B. Grund bei failed" }

    Member:
      type: object
      properties:
        id: { type: string }
        userId: { type: string, description: 'Bei gelöschten Konten "" (leer)' }
        leftAt:
          type: [string, "null"]
          format: date-time
          description: Hat die Kampagne verlassen oder wurde entfernt (ab 0.4.5); wie deletedAt nirgends mehr anbieten
        deletedAt:
          type: [string, "null"]
          format: date-time
          description: |
            Gesetzt, wenn das Konto gelöscht wurde. Das Mitglied bleibt stehen (displayName „Gelöschtes Konto“ /
            „Deleted account“, Charaktername bleibt), damit Kapitel und Kommentare stimmig bleiben. Nicht als Anwesende,
            Empfänger oder Auswahl anbieten (Server: attendee_unknown, recipient_unknown).
        displayName: { type: string }
        characterName: { type: [string, "null"] }
        role: { $ref: "#/components/schemas/Role" }
        recordingConsentAt:
          type: [string, "null"]
          format: date-time
          description: Stehende Zustimmung zu Aufnahmen in dieser Kampagne (selbst gegeben); null = keine
        characterSummary:
          type: [string, "null"]
          description: Kurzbeschreibung des Charakters, für alle Mitglieder sichtbar; darf in Recap/Vorschläge einfließen
        characterBackstory:
          type: [string, "null"]
          description: |
            Hintergrund nur für die Person selbst und die SL. Für alle anderen lässt der Server das Feld weg
            (auch in Listen). Fließt NIE in Recaps oder Vorschläge ein.
        portraitUpdatedAt:
          type: [string, "null"]
          format: date-time
          description: Gesetzt, wenn ein Charakterbild existiert; die App nutzt es als Cache-Schlüssel
        characterId:
          type: [string, "null"]
          description: |
            Ab 0.4.7: UUID aus der Sammlung der App; null bei Altbestand und Gästen. Ab 0.4.8 nur für die Person selbst
            und die SL – für andere Spieler lässt der Server das Feld weg (die Kennung ist der Schlüssel zu einem
            offenen Platz).
        characterVersion: { type: [integer, "null"], description: "Ab 0.4.7: Stand der Serverkopie; ab 0.4.8 sichtbar wie characterId" }
        characterStatus:
          type: [string, "null"]
          enum: [active, retired, deceased, null]
          description: Ab 0.4.7
        characterNickname: { type: [string, "null"], description: "Ab 0.4.7" }
        moveConsentAt:
          type: [string, "null"]
          format: date-time
          description: |
            Ab 0.4.8: „Meine Charakterdaten dürfen bei einem Umzug mit“ – für alle Mitglieder sichtbar (wie
            recordingConsentAt), damit die SL vor dem Export sieht, wer zugestimmt hat. null = nein (Standard).
        openSeat:
          type: boolean
          description: |
            Ab 0.4.8: Platz aus einem Umzug, noch nicht besetzt. userId ist dann "", deletedAt und leftAt null. Nicht als
            Anwesende, Empfänger oder Auswahl anbieten (wie gelöschte Konten). Ehemalige aus der Datei kommen mit leftAt.

    CampaignSummary:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        archivedAt:
          type: [string, "null"]
          format: date-time
          description: Abgeschlossen seit (ab 0.4.5); die App zeigt solche Kampagnen eingeklappt unter „Abgeschlossen“
        organization:
          type: [object, "null"]
          properties:
            id: { type: string }
            name: { type: string }
        myRole: { $ref: "#/components/schemas/Role" }
        myCharacterName: { type: [string, "null"] }
        memberCount: { type: integer }
        publishedSessionCount: { type: integer }
        pendingReviewCount:
          type: integer
          description: Nur für SL befüllt, für Spieler immer 0
        openCharacterProposals:
          type: integer
          description: Ab 0.4.7; offene Vorschläge aus mitgebrachter Welt, nur für SL befüllt, für Spieler 0
        lastPublishedAt: { type: [string, "null"], format: date-time }
        coverPreset:
          oneOf:
            - { $ref: "#/components/schemas/CoverPreset" }
            - { type: "null" }
          description: Mitgeliefertes Motiv. Neue Kampagnen bekommen ein zufälliges.
        unread:
          type: object
          description: Ungelesenes seit den eigenen Markern (nur Dinge, die man sehen darf und nicht selbst erstellt hat)
          properties:
            recaps: { type: integer, description: "Veröffentlichte Recaps nach dem Chronik-Marker" }
            comments: { type: integer, description: "Kommentare anderer nach dem Marker des jeweiligen Kapitels (fehlt er: Chronik-Marker)" }
            bible: { type: integer, description: "Neue/geänderte sichtbare Einträge nach dem Bibel-Marker; für die SL immer 0" }
        coverImageUpdatedAt:
          type: [string, "null"]
          format: date-time
          description: Gesetzt, wenn ein eigenes Titelbild existiert (hat Vorrang vor coverPreset)
        nextSessionAt:
          type: [string, "null"]
          format: date-time
          description: Festgelegter Termin der nächsten Runde (aus der letzten beendeten Abstimmung)
        datePollNeedsMyVote:
          type: boolean
          description: Es läuft eine Abstimmung und ich habe bei mindestens einem Termin noch nicht geantwortet

    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignSummary"
        - type: object
          properties:
            description: { type: string }
            language: { $ref: "#/components/schemas/ContentLanguage" }
            system:
              oneOf:
                - { $ref: "#/components/schemas/GameSystem" }
                - { type: "null" }
            systemName:
              type: [string, "null"]
              maxLength: 100
              description: Frei eingetragener Name des Systems, v. a. bei `other` (z. B. „Household“). Keine Wortliste, nur Kontext für die Zusammenfassung.
            allowCloudSummary:
              type: boolean
              default: false
              description: |
                Darf der Server Recap und Vorschläge dieser Kampagne – und das Auswerten ihrer SL-Unterlagen – über die
                Cloud-API aus ServerInfo.cloudSummary erledigen?
                Dabei geht der Text der Session (Namen, Gespräche – keine Stimmen) an den Anbieter. Nur die SL ändert das
                (PATCH). Standard false; in der Betriebsart „Nur Cloud“ setzt der Server neue Kampagnen auf true.
                false und kein lokales Modell verfügbar: Session bleibt in summarizing mit passender message.
            allowExternalTranscription:
              type: boolean
              default: false
              description: |
                Darf der Server für diese Kampagne den externen Anbieter aus ServerInfo.externalTranscription
                nutzen (z. B. wenn der eigene Worker nicht erreichbar ist)? Nur die SL ändert das (PATCH).
                Standard false. Ist der Server ohne externen Anbieter, bleibt der Wert wirkungslos.
            worldInfo:
              type: [string, "null"]
              description: Hintergrund der Spielwelt für alle Mitglieder (Absätze durch Leerzeilen getrennt)
            hotwords:
              type: array
              maxItems: 200
              items: { type: string, maxLength: 40 }
              description: |
                Namenshilfe für die Transkription (nur SL, ab 0.4.6; für Spieler weggelassen). Der Server leitet sie
                anfangs aus Charakternamen, Bibel und worldInfo ab; Korrekturen aus POST …/corrections mit addToHotwords
                kommen dazu. Per PATCH /campaigns/{id} ganz ersetzbar.
            gmNotices:
              type: array
              description: |
                Hinweise an die SL (ab 0.4.7; für Spieler weggelassen). hidden_entries_for_newcomer: Ein neues Mitglied
                wurde beim Beitritt in alle nicht-leeren hiddenFromMemberIds-Listen aufgenommen; die SL gibt einzeln
                frei (PATCH /entries/{id}) und erledigt den Hinweis mit DELETE /campaigns/{id}/gm-notices/{noticeId}.
              items: { $ref: "#/components/schemas/GmNotice" }
            members:
              type: array
              items: { $ref: "#/components/schemas/Member" }

    Attendee:
      type: object
      description: |
        Genau eines von memberId (Mitglied) oder guestName (Gast ohne Konto).
        consentSource app: nur zulässig, wenn das Mitglied `recordingConsentAt` hat (sonst 409 `consent_missing`).
        Gäste nur mit on_site (sonst 400 `invalid_attendee`).
      required: [consent, consentSource]
      properties:
        memberId: { type: string }
        guestName: { type: string }
        consent: { type: boolean }
        consentSource: { type: string, enum: [app, on_site] }
        consentAt: { type: [string, "null"], format: date-time, description: "Bei on_site der Zeitpunkt der Bestätigung vor Ort" }

    SessionSummary:
      type: object
      properties:
        id: { type: string }
        number: { type: integer, description: Kapitelnummer }
        title: { type: [string, "null"] }
        playedAt: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/ProcessingState" }
        unreadComments: { type: integer, description: "Neue Kommentare anderer in diesem Kapitel seit dem eigenen Marker" }

    Session:
      allOf:
        - $ref: "#/components/schemas/SessionSummary"
        - type: object
          properties:
            campaignId: { type: string }
            source: { type: [string, "null"], enum: [table, discord, null] }
            attendees:
              type: array
              items: { $ref: "#/components/schemas/Attendee" }
            durationSeconds: { type: [integer, "null"] }
            audioDeletedAt: { type: [string, "null"], format: date-time }
            transcriptionEngine:
              type: [string, "null"]
              enum: [local, external, null]
              description: Womit transkribiert wurde – eigener Worker (local) oder externer Anbieter; null solange offen
            publishedAt: { type: [string, "null"], format: date-time }

    ProcessingState:
      type: string
      enum:
        - created            # angelegt, noch kein Audio
        - uploading
        - queued
        - transcribing
        - awaiting_speakers  # SL muss Stimmen zuordnen
        - summarizing
        - awaiting_review    # SL muss Vorschläge prüfen
        - published
        - failed

    ProcessingStatus:
      type: object
      properties:
        state: { $ref: "#/components/schemas/ProcessingState" }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        queuePosition: { type: [integer, "null"] }
        message:
          type: [string, "null"]
          description: |
            z. B. Fehlertext bei failed oder ein Hinweis beim Warten. Ab 0.4.6 in summarizing einer dieser Schlüssel,
            den die App übersetzt: summarizing.notes (Szenennotizen), summarizing.recap, summarizing.proposals,
            summarizing.review (Gegenprüfung), summarizing.revision (Nachbesserung). Andere Texte zeigt die App wie
            bisher unverändert an.
        updatedAt: { type: string, format: date-time }
        estimatedSeconds:
          type: [integer, "null"]
          description: |
            Geschätzte Restdauer in Sekunden (ab 0.4.6), vor allem in der 202-Antwort von POST …/corrections mit
            retranscribe (aus der letzten Rechenzeit dieser Session). null = keine Schätzung.

    Speaker:
      type: object
      properties:
        id: { type: string }
        label: { type: string, example: "Stimme 3" }
        speakingSeconds: { type: number }
        sampleText: { type: string, description: Transkript der Hörprobe }
        suggestedMemberId: { type: [string, "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        source: { type: string, enum: [intro_round, voice_match, discord_track, none] }
        assignedGuestName: { type: [string, "null"], description: "Ab 0.4.7: als Gast benannt (nach PUT)" }
        assignedMemberId:
          type: [string, "null"]
          description: |
            Ab 0.4.10: bestätigte Zuordnung nach PUT. Fehlt das Feld oder ist die Session noch in awaiting_speakers,
            gibt es noch keine Bestätigung. null nach der Bestätigung = Gast (assignedGuestName) oder ignoriert.

    InvitePreview:
      type: object
      description: Ab 0.4.10, Antwort von GET /invites/{code}
      required: [campaignTitle]
      properties:
        campaignTitle: { type: string }
        seatCharacterName:
          type: [string, "null"]
          description: Bei einer Platz-Einladung (POST …/members/{id}/invite) der Name der Figur auf diesem Platz
        expiresAt: { type: [string, "null"], format: date-time }

    Proposal:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: [string, "null"], description: "null bei Vorschlägen aus Unterlagen" }
        documentId: { type: [string, "null"] }
        source:
          type: string
          enum: [session, document, character]
          description: Ab 0.4.7; ältere Server lassen es weg (dann aus sessionId/documentId ableiten)
        originCharacterId: { type: [string, "null"], description: "Ab 0.4.7, nur bei source character" }
        originEntryId: { type: [string, "null"], description: "Ab 0.4.7, nur bei source character" }
        submittedByMemberId: { type: [string, "null"], description: "Ab 0.4.7, bei source character die Urheberin" }
        entryType: { $ref: "#/components/schemas/EntryType" }
        action:
          type: string
          enum: [create, update, reveal]
          description: |
            create = neuer Eintrag; update = ergänzt targetEntryId; reveal = targetEntryId ist bisher gm_only und wurde
            in dieser Session am Tisch bekannt (z. B. die Gruppe trifft den NSC, betritt den Ort, erfährt den Namen).
            Bei reveal: detail = künftig öffentlicher Text (nur das, was die Spieler jetzt wissen), gmNotes = was
            geheim bleibt, suggestedVisibility public, visibilityReason + evidence = woran es erkannt wurde.
            Nur Vorschläge aus Sessions, nie aus Unterlagen; nie automatisch – erst beim Veröffentlichen, wenn die SL
            angenommen hat, wird der Eintrag public. Kein reveal, wenn nur die SL den Namen erwähnt hat (z. B.
            Regelerklärung, Off-Topic) – der Name muss als Spielerwissen in der Szene vorkommen.
        targetEntryId: { type: [string, "null"], description: Bei update der betroffene Eintrag }
        title: { type: string }
        detail: { type: string, description: "Spielerwissen (öffentlicher Teil)" }
        gmNotes: { type: [string, "null"], description: "Geheimer Teil, nur für die SL" }
        suggestedVisibility: { $ref: "#/components/schemas/Visibility" }
        hiddenFromMemberIds:
          type: array
          items: { type: string }
          description: |
            Nur bei suggestedVisibility public: vor diesen Mitgliedern verborgen. Setzt die SL beim Prüfen; beim
            Veröffentlichen (Session) bzw. Übernehmen (Unterlage) wird es zu Entry.hiddenFromMemberIds. Standard leer.
        publicSuggested: { type: boolean, description: "Nur bei kind mixed: KI hält den Eintrag für Spielerwissen, er bleibt aber gm_only, bis die SL freigibt" }
        visibilityReason: { type: [string, "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        flags:
          type: array
          items: { type: string, enum: [joke_suspected, low_confidence, contradicts_bible, evidence_not_found] }
          description: |
            evidence_not_found (ab 0.4.6) = kein Zitat des Vorschlags im Transkript gefunden; die App nennt den Grund
            („Beleg im Transkript nicht gefunden“). Ältere Apps behandeln unbekannte Kennzeichen wie low_confidence.
        evidence:
          type: array
          description: Belegstellen im Transkript
          items:
            type: object
            properties:
              start: { type: number, description: "Sekunden im Transkript (bei Sessions)" }
              page: { type: integer, description: "Seitenzahl (bei Unterlagen)" }
              quote: { type: string }
        decision: { type: string, enum: [open, accepted, rejected] }

    VoteAnswer:
      type: string
      # In Anführungszeichen: YAML-1.1-Leser würden yes/no sonst als Wahrheitswerte lesen
      enum: ["yes", "maybe", "no"]

    DateOption:
      type: object
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        proposedByMemberId: { type: string }
        votes:
          type: array
          items:
            type: object
            properties:
              memberId: { type: string }
              answer: { $ref: "#/components/schemas/VoteAnswer" }

    DatePoll:
      type: object
      properties:
        id: { type: string }
        campaignId: { type: string }
        status: { type: string, enum: [open, closed, cancelled] }
        note: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        chosenOptionId: { type: [string, "null"] }
        options:
          type: array
          description: Aufsteigend nach startsAt
          items: { $ref: "#/components/schemas/DateOption" }

    Comment:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        authorMemberId: { type: string }
        recipientMemberId:
          type: [string, "null"]
          description: null = für alle; sonst privat (nur Absender und Empfänger sehen ihn)
        text: { type: string }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, "null"], format: date-time }

    Recap:
      type: object
      properties:
        sessionId: { type: string }
        number: { type: integer }
        title: { type: string }
        text: { type: string, description: Vorlesbarer Recap, Absätze durch Leerzeilen getrennt }
        openThreads: { type: array, items: { type: string } }
        publishedAt: { type: [string, "null"], format: date-time }
        review: { $ref: "#/components/schemas/RecapReview" }

    RecapReview:
      type: object
      description: |
        Prüfteil des Recaps (ab 0.4.6). Nur für die SL, vor und nach der Veröffentlichung; für Spieler weggelassen.
        Absatz = durch Leerzeile getrennter Block in Recap.text, gleiche Reihenfolge. Der Server streicht nichts; jede
        Entscheidung bleibt bei der SL. Nach PUT …/recap bleiben die Angaben stehen, können aber verrutschen:
        dann stale true, die App zeigt die Prüfung als „vor deiner Änderung“.
      properties:
        state: { type: string, enum: [pending, done, skipped], description: "skipped = Prüfung in der Verwaltung abgeschaltet oder kein Modell" }
        stale: { type: boolean, default: false, description: "Recap wurde nach der Prüfung bearbeitet" }
        checkedAt: { type: [string, "null"], format: date-time }
        model: { type: [string, "null"], description: "Sprachmodell der Gegenprüfung" }
        revised: { type: boolean, description: "Beanstandete Absätze wurden einmal neu geschrieben" }
        report:
          type: object
          properties:
            total: { type: integer }
            supported: { type: integer }
            partial: { type: integer }
            unsupported: { type: integer }
            contradicted: { type: integer }
            offGame: { type: integer }
        paragraphs:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, description: "0-basiert, Absatz in text" }
              verdict:
                type: string
                enum: [supported, partial, unsupported, contradicted, off_game, unchecked]
                description: |
                  supported = alle Aussagen belegt; partial = teilweise; unsupported = kein Beleg; contradicted =
                  Transkript sagt etwas anderes; off_game = vermutlich Witz oder außerhalb des Spiels; unchecked =
                  übersprungen (z. B. Zeitgrenze).
              note: { type: [string, "null"], description: "Kurze Begründung des Prüfers für die SL" }
              evidence:
                type: array
                description: Belegstellen im Transkript (echte Zeitpunkte)
                items:
                  type: object
                  properties:
                    start: { type: number }
                    end: { type: [number, "null"] }
                    quote: { type: string }
                    speakerMemberId: { type: [string, "null"] }

    UncertainTerm:
      type: object
      properties:
        id: { type: string }
        heard: { type: string, example: "Tharvok" }
        alternatives: { type: array, items: { type: string }, example: ["Darvok", "Tarvok"] }
        occurrences: { type: integer }
        confidence: { type: number, minimum: 0, maximum: 1 }
        examples:
          type: array
          maxItems: 3
          items:
            type: object
            properties:
              start: { type: number }
              quote: { type: string }
        suggestedEntryId: { type: [string, "null"], description: "Ähnlich klingender Bibel-Eintrag" }
        suggestedMemberId: { type: [string, "null"], description: "Ähnlich klingender Charaktername" }

    EntryInput:
      type: object
      properties:
        type: { $ref: "#/components/schemas/EntryType" }
        name: { type: string }
        summary: { type: string }
        status: { type: [string, "null"], enum: [active, done, null], description: Nur für Quests }
        holderMemberId: { type: [string, "null"], description: Nur für Gegenstände }
        visibility: { $ref: "#/components/schemas/Visibility" }
        hiddenFromMemberIds:
          type: array
          items: { type: string }
          description: |
            Nur bei visibility public: vor diesen Mitgliedern verborgen (z. B. Spieler, deren Charakter nicht dabei war).
            Leer = alle sehen den öffentlichen Teil. Setzt nur die SL (PATCH). Für Spieler: Einträge, die vor ihnen
            verborgen sind, werden nicht ausgeliefert (Liste, Suche, Einzelabruf 404, Ungelesen-Zähler); das Feld selbst
            bekommen Spieler nie. Recaps sehen alle – deshalb behandelt die Recap-Pipeline teilweise verborgene
            Einträge wie gm_only. Vor allen Spielern verborgen = gm_only (die App schickt dann visibility gm_only).
        gmNotes:
          type: [string, "null"]
          description: |
            Geheimer Teil eines (auch öffentlichen) Eintrags. Für Spieler lässt der Server das Feld weg; die Volltextsuche
            der Spieler durchsucht es nicht. Recap-Pipeline bekommt nur öffentliche Einträge OHNE gmNotes;
            die Vorschlags-Pipeline bekommt die ganze Bibel inklusive gmNotes.

    Entry:
      allOf:
        - $ref: "#/components/schemas/EntryInput"
        - type: object
          properties:
            id: { type: string }
            campaignId: { type: string }
            firstSessionNumber: { type: [integer, "null"] }
            lastSessionNumber: { type: [integer, "null"] }
            mentions:
              type: array
              items:
                type: object
                properties:
                  sessionNumber: { type: integer }
                  note: { type: string }
            updatedAt: { type: string, format: date-time }
            originCharacterId: { type: [string, "null"], description: "Ab 0.4.7: mitgebrachter Eintrag – nur für SL und Urheberin, sonst weggelassen" }
            originEntryId: { type: [string, "null"] }
            originVersion: { type: [integer, "null"] }
            formerHolderMemberId:
              type: [string, "null"]
              description: |
                Ab 0.4.9: NSC, der aus der Figur dieses (ausgetretenen) Mitglieds entstanden ist (POST …/to-npc). Nur für
                die SL, für Spieler weggelassen. Name über die Mitgliederliste (auch Ehemalige).

    Character:
      type: object
      description: |
        Serverkopie der Stammdaten eines Charakters aus der Sammlung der App (ab 0.4.7). Die App vergibt id und zählt
        version bei jeder Änderung hoch; der Server bearbeitet sie nie. Nicht auf dem Server: private Notizen, Galerie
        (nur das eine Porträt über …/portrait), eigene Unterlagen (nur auf Wunsch als character_sheet).
      required: [id, version, name, status]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 128, description: "wird zu Member.characterName" }
        nickname: { type: [string, "null"], maxLength: 64 }
        summary: { type: [string, "null"], maxLength: 2000, description: "wird zu Member.characterSummary (alle Mitglieder; darf in Recap/Vorschläge)" }
        backstory: { type: [string, "null"], maxLength: 20000, description: "wird zu Member.characterBackstory (nur Person und SL; nie in Recap/Vorschläge)" }
        system: { type: [string, "null"], maxLength: 64, description: "Regelsystem als freier Text, nur Anzeige" }
        status: { type: string, enum: [active, retired, deceased] }
        statusChangedAt: { type: [string, "null"], format: date-time }

    WorldEntryIn:
      type: object
      required: [id, version, type, name, summary, secret]
      properties:
        id: { type: string, format: uuid, description: "Kennung der App" }
        version: { type: integer, minimum: 1 }
        type: { type: string, enum: [npc, location, faction, item, quest, other] }
        name: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 4000 }
        secret: { type: boolean, description: "Nur SL und Urheberin sollen es wissen" }

    WorldEntryStatus:
      type: object
      properties:
        id: { type: string, description: "wie eingereicht" }
        proposalId: { type: [string, "null"] }
        entryId: { type: [string, "null"], description: "Übernommener Eintrag auf dem Server" }
        state: { type: string, enum: [pending, accepted, rejected, unchanged] }
        serverVersion: { type: [integer, "null"], description: "Zuletzt übernommene Version" }

    Chronicle:
      type: object
      description: Abschrift aus Sicht der Urheberin (ab 0.4.7)
      properties:
        server:
          type: object
          properties:
            name: { type: string }
            url: { type: string }
            version: { type: string }
        campaign:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            system: { type: [string, "null"] }
            language: { $ref: "#/components/schemas/ContentLanguage" }
            createdAt: { type: string, format: date-time }
            archivedAt: { type: [string, "null"], format: date-time }
        member:
          type: object
          properties:
            id: { type: string }
            role: { $ref: "#/components/schemas/Role" }
            joinedAt: { type: string, format: date-time }
            leftAt: { type: [string, "null"], format: date-time }
            characterId: { type: [string, "null"] }
            characterVersion: { type: [integer, "null"] }
        sessions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              number: { type: integer }
              title: { type: [string, "null"] }
              playedAt: { type: string, format: date-time }
              attended: { type: boolean }
              recap:
                description: Nur bei veröffentlichten Kapiteln mit Anwesenheit
                oneOf:
                  - type: object
                    properties:
                      title: { type: string }
                      text: { type: string }
                      openThreads: { type: array, items: { type: string } }
                      publishedAt: { type: string, format: date-time }
                  - { type: "null" }
        mentions:
          type: array
          description: Öffentliche, für die Person sichtbare Einträge, die den Charakter erwähnen
          items:
            type: object
            properties:
              entryId: { type: string }
              entryType: { $ref: "#/components/schemas/EntryType" }
              name: { type: string }
              summary: { type: string }
              updatedAt: { type: string, format: date-time }
        broughtEntries:
          type: array
          description: Mitgebrachte Einträge in ihrer öffentlichen Serverfassung
          items:
            type: object
            properties:
              originEntryId: { type: string }
              entryId: { type: string }
              entryType: { $ref: "#/components/schemas/EntryType" }
              name: { type: string }
              summary: { type: string }
              hidden: { type: boolean }
              updatedAt: { type: string, format: date-time }
        comments:
          type: array
          items:
            type: object
            properties:
              sessionId: { type: string }
              text: { type: string }
              createdAt: { type: string, format: date-time }
        takenAt: { type: string, format: date-time }

    CampaignExport:
      type: object
      description: Export einer Kampagne als taleward-kampagne/1 (ab 0.4.8)
      required: [id, state, consentedMemberIds, createdAt]
      properties:
        id: { type: string }
        state: { type: string, enum: [queued, processing, ready, failed] }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        sizeBytes: { type: [integer, "null"], description: "bei ready" }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: bei ready + 24 h; danach löscht der Server die Datei (410 export_expired)
        downloadUrl:
          type: [string, "null"]
          description: |
            Bei ready: Adresse der Datei mit Download-Schlüssel (Parameter t), relativ zur API-Basis (z. B.
            /campaigns/c1/exports/x1/file?t=…). Gilt bis expiresAt, ohne Bearer-Token nutzbar.
        consentedMemberIds:
          type: array
          items: { type: string }
          description: Wessen Charakterdaten mitgehen (Stand beim Start)
        message: { type: [string, "null"], description: "z. B. Fehlertext bei failed" }
        createdAt: { type: string, format: date-time }

    ImportStatus:
      type: object
      description: Import einer Datei taleward-kampagne/1 (ab 0.4.8)
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, enum: [uploading, processing, done, failed] }
        progress: { type: [number, "null"], minimum: 0, maximum: 1 }
        missingChunks: { type: array, items: { type: integer }, description: "nur bei uploading" }
        campaignId: { type: [string, "null"], description: "bei done" }
        openSeats: { type: [integer, "null"], description: "bei done: Zahl der offenen Plätze" }
        message:
          type: [string, "null"]
          description: |
            Bei failed ein fester Schlüssel: import_format (unbekanntes oder beschädigtes Format), import_too_large,
            import_unsafe (unzulässige Pfade oder zu große entpackte Größe), import_version (Datei von einer neueren
            Schnittstelle als der Server kann); sonst Klartext.

    GmNotice:
      type: object
      properties:
        id: { type: string }
        code:
          type: string
          enum: [hidden_entries_for_newcomer, seat_claimed, character_orphaned]
          description: |
            hidden_entries_for_newcomer (ab 0.4.7): Neuzugang wurde in teilweise verborgene Einträge aufgenommen.
            seat_claimed (ab 0.4.8): Jemand hat per Beitritt mit Charakter einen offenen Platz eingenommen (memberId);
            erledigen per DELETE …/gm-notices/{id} oder Platz wieder freigeben (POST …/members/{id}/release).
            character_orphaned (ab 0.4.9): Ein Spieler hat die Kampagne verlassen oder sein Konto gelöscht; entryIds =
            seine pc-Einträge. Die App bietet an: als NSC weiterführen (…/to-npc), später einem anderen Spieler geben
            (…/assign), verabschieden (Status) oder später. Erledigen per DELETE …/gm-notices/{id}; der Server löscht
            den Hinweis selbst, wenn alle entryIds nicht mehr pc ohne Halter sind.
        memberId: { type: [string, "null"], description: "Betroffenes Mitglied" }
        entryIds: { type: array, items: { type: string }, description: "Betroffene Einträge" }
        createdAt: { type: string, format: date-time }
