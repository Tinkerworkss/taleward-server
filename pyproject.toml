[project]
name = "taleward-server"
version = "0.4.1"
description = "Taleward – Server für Recaps und Kampagnenbibel von Rollenspielrunden"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pwdlib[argon2]>=0.2",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=11",
    "pypdf>=5",
    "segno>=1.6",
]

[project.optional-dependencies]
# KI-Verarbeitung (Transkription, Sprechertrennung). Installieren mit: uv sync --extra ki
ki = [
    "whisperx==3.8.6",
]

[project.scripts]
chronik = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pyyaml>=6",
    "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
