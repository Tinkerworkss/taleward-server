name: temporary 0.4.57 validation
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Compile
        run: uv run python -m compileall -q app tests
      - name: Targeted Ledger 0.4.57 tests
        run: uv run pytest -q tests/test_szenennotizen.py tests/test_ledger_harness.py tests/test_modellvergleich.py
      - name: Full suite
        run: uv run pytest -q
