name: temporary 0.4.55 validation
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Compile
        run: uv run python -m compileall -q app tests
      - name: Targeted Ledger tests
        run: uv run pytest -q tests/test_szenennotizen.py tests/test_modellvergleich.py
      - name: Full suite
        run: uv run pytest -q
