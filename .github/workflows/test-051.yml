name: Test 0.4.51 branch

on:
  push:
    branches:
      - "test/0.4.48-recap-plan-relations"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: uv sync --frozen
      - name: Syntax check
        run: uv run python -m compileall -q app tests
      - name: Ledger and harness tests
        run: uv run pytest -q tests/test_ollama_laden.py tests/test_szenennotizen.py tests/test_modellvergleich.py
      - name: Recap regression tests
        run: uv run pytest -q tests/test_pruefung_046.py tests/test_step5.py
      - name: Full suite
        run: uv run pytest -q
