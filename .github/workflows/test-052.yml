name: test 0.4.52

on:
  push:
    branches:
      - test/0.4.48-recap-plan-relations
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install
        run: uv sync --dev
      - name: Compile
        run: uv run python -m compileall -q app tests
      - name: Ledger and harness regression
        run: uv run pytest -q tests/test_szenennotizen.py tests/test_modellvergleich.py
      - name: Full suite
        run: uv run pytest -q
